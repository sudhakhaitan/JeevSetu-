<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JeevSetu Section 17 — Anxiety & Depression Screening</title>
<style>
body{font-family:Arial,sans-serif;max-width:820px;margin:auto;padding:18px;background:#f4f6f8}
.card{background:white;padding:22px;border-radius:14px}
h1{font-size:26px}.q{font-size:21px;margin:22px 0}.btn{font-size:18px;padding:12px 20px;margin:6px;border-radius:8px;border:1px solid #999;background:#fafafa}
.btn.primary{background:#e9f2ff}.small{font-size:16px;color:#555}.private{padding:14px;background:#f7f3ff;border-left:5px solid #6b3fa0;margin:15px 0}
.flag{padding:14px;background:#fff4f4;border-left:5px solid #b00020}.ok{padding:14px;background:#f3faf6;border-left:5px solid #26734d}
table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}
</style>
</head>
<body><div class="card"><div id="app"></div></div>
<script>
const app=document.getElementById('app');
const A={}; let stage='consent', qi=0;

const PHQ=[
"पिछले 2 हफ्तों में, आपको काम करने में, चीज़ों में मन लगाने में या किसी काम को पूरा करने में कितनी परेशानी हुई?",
"पिछले 2 हफ्तों में, आपको किसी काम को करने में बहुत कम दिलचस्पी या खुशी हुई?",
"पिछले 2 हफ्तों में, आपको उदासी, निराशा या बहुत मायूसी महसूस हुई?",
"पिछले 2 हफ्तों में, आपको नींद आने में परेशानी, रात में बार-बार नींद खुलना, या बहुत ज्यादा सोना हुआ?",
"पिछले 2 हफ्तों में, आपको थकान या ऊर्जा की कमी महसूस हुई?",
"पिछले 2 हफ्तों में, आपको भूख कम या ज्यादा लगना हुआ?",
"पिछले 2 हफ्तों में, आपको अपने बारे में बुरा लगा — जैसे आपको लगता हो कि आप असफल हैं, या आपने खुद को या अपने परिवार को निराश किया है?",
"पिछले 2 हफ्तों में, आपको किसी बात पर ध्यान लगाने में परेशानी हुई — जैसे अखबार पढ़ने या टीवी देखने में?",
"पिछले 2 हफ्तों में, क्या आपको ऐसा लगा कि आपके लिए बेहतर होता अगर आप मर जाते, या आपने किसी तरह खुद को नुकसान पहुँचाने के बारे में सोचा?"
];

const GAD=[
"पिछले 2 हफ्तों में, आपको घबराहट, चिंता या तनाव कितनी बार रहा?",
"पिछले 2 हफ्तों में, आपको अपनी चिंता को रोकना या उस पर काबू पाना कितनी बार मुश्किल लगा?",
"पिछले 2 हफ्तों में, आपको अलग-अलग बातों को लेकर बहुत ज्यादा चिंता कितनी बार हुई?",
"पिछले 2 हफ्तों में, आपको आराम करने में कितनी बार परेशानी हुई?",
"पिछले 2 हफ्तों में, आपको इतनी बेचैनी हुई कि चुपचाप बैठना मुश्किल लगा?",
"पिछले 2 हफ्तों में, आपको आसानी से चिढ़ या गुस्सा कितनी बार आया?",
"पिछले 2 हफ्तों में, आपको ऐसा लगा कि जैसे कोई बुरी बात होने वाली है, कितनी बार हुआ?"
];

const opts=[
["बिल्कुल नहीं",0],["कई दिनों में",1],["आधे से अधिक दिनों में",2],["लगभग हर दिन",3]
];

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function start(){
 stage='privacy';
 render();
}
function render(){
 if(stage==='consent'){
   app.innerHTML=`<h1>JeevSetu — Section 17<br>चिंता और मनोदशा की प्रारंभिक जाँच</h1>
   <div class="private"><b>यह एक निजी और वैकल्पिक जाँच है।</b><br>
   इसमें मन, चिंता और भावनाओं से जुड़े कुछ व्यक्तिगत प्रश्न होंगे। आप चाहें तो इसे न करने का विकल्प चुन सकते हैं। आपके उत्तर आपकी अनुमति के बिना इतिहास लेने वाले व्यक्ति को नहीं दिखाए जाएंगे।</div>
   <div class="q">क्या आप इस निजी जाँच के प्रश्नों का उत्तर देना चाहेंगे?</div>
   <button class="btn primary" onclick="start()">हाँ, मैं सहमत हूँ</button>
   <button class="btn" onclick="decline()">नहीं, मैं यह जाँच नहीं करना चाहता/चाहती</button>`;
   return;
 }
 if(stage==='privacy'){
   app.innerHTML=`<h1>निजी उत्तर देने की सूचना</h1>
   <div class="private">
   कृपया जहाँ संभव हो, इन प्रश्नों का उत्तर ऐसी जगह दें जहाँ आपको निजता मिले।<br><br>
   यह प्रश्नावली <b>self-completion</b> के लिए है। इतिहास लेने वाले गैर-चिकित्सकीय व्यक्ति को आपके व्यक्तिगत उत्तर नहीं दिखाए जाने चाहिए।
   </div>
   <p>हर प्रश्न के लिए पिछले <b>2 हफ्तों</b> के आधार पर एक विकल्प चुनें।</p>
   <button class="btn primary" onclick="stage='phq';qi=0;render()">शुरू करें</button>`;
   return;
 }
 if(stage==='phq'){question('PHQ-9',PHQ,qi);return;}
 if(stage==='gad'){question('GAD-7',GAD,qi);return;}
 if(stage==='impact'){
   app.innerHTML=`<h2>दैनिक जीवन पर असर</h2><div class="q">इन परेशानियों की वजह से आपके रोज़मर्रा के काम, घर के काम या लोगों से मिलने-जुलने में कितनी परेशानी होती है?</div>
   ${["बिल्कुल कोई परेशानी नहीं","थोड़ी परेशानी","काफी परेशानी","बहुत ज्यादा परेशानी"].map((x,i)=>`<button class="btn" onclick="A.impact=${i};stage='report';render()">${x}</button>`).join('')}`;
   return;
 }
 if(stage==='report'){report();return;}
}
function question(name,list,n){
 app.innerHTML=`<h2>${name}</h2><p class="small">प्रश्न ${n+1} / ${list.length}</p>
 <div class="q">${esc(list[n])}</div>
 ${opts.map(o=>`<button class="btn" onclick="choose(${o[1]})">${o[0]}</button>`).join('')}`;
}
function choose(v){
 const key=stage==='phq'?'phq':'gad';
 A[key]=A[key]||[]; A[key][qi]=v;
 qi++;
 if(stage==='phq' && qi<PHQ.length){render();return;}
 if(stage==='phq'){stage='gad';qi=0;render();return;}
 if(stage==='gad' && qi<GAD.length){render();return;}
 stage='impact';render();
}
function decline(){
 A.consent='नहीं';
 stage='report';render();
}
function score(arr){return (arr||[]).reduce((a,b)=>a+(Number(b)||0),0)}
function severityPHQ(s){return s<=4?"न्यूनतम":s<=9?"हल्का":s<=14?"मध्यम":s<=19?"मध्यम से गंभीर":"गंभीर"}
function severityGAD(s){return s<=4?"न्यूनतम":s<=9?"हल्का":s<=14?"मध्यम":"गंभीर"}
function report(){
 if(A.consent==='नहीं'){
   app.innerHTML=`<h2>Section 17 पूरा हुआ</h2><div class="ok"><b>Patient declined.</b><br>रोगी ने निजी Anxiety & Depression Screening करने की सहमति नहीं दी। कोई screening score नहीं बनाया गया।</div>
   <p class="small">यह निर्णय सम्मानित किया जाना चाहिए। गैर-चिकित्सकीय history taker को आगे इन संवेदनशील प्रश्नों पर पूछताछ नहीं करनी चाहिए।</p>`;
   return;
 }
 const ps=score(A.phq), gs=score(A.gad), risk=(A.phq&&A.phq[8]>0);
 let safety=risk?`<div class="flag"><b>URGENT CLINICAL ALERT</b><br>
 PHQ-9 के अंतिम प्रश्न पर सकारात्मक उत्तर दर्ज हुआ है। यह screening result है, diagnosis नहीं। इतिहास लेने वाला व्यक्ति आगे पूछताछ या counselling न करे। निर्धारित clinical/safety pathway के अनुसार <b>तुरंत अधिकृत clinician/mental-health professional को निजी रूप से सूचित करें</b> और रोगी को अकेला न छोड़ें जहाँ तत्काल जोखिम की आशंका हो.</div>`:
 `<div class="ok"><b>Safety item:</b> कोई सकारात्मक उत्तर दर्ज नहीं हुआ। यह screening diagnosis नहीं है.</div>`;
 app.innerHTML=`<h2>Clinician-only Result — Section 17</h2>
 <div class="private"><b>Privacy:</b> यह परिणाम केवल अधिकृत clinician/authorized clinical reviewer के लिए है। Non-medico history taker को व्यक्तिगत उत्तर या संवेदनशील विवरण प्रदर्शित न करें।</div>
 ${safety}
 <table>
 <tr><th>Instrument</th><th>Score</th><th>Screening range</th></tr>
 <tr><td>PHQ-9</td><td>${ps}/27</td><td>${severityPHQ(ps)}</td></tr>
 <tr><td>GAD-7</td><td>${gs}/21</td><td>${severityGAD(gs)}</td></tr>
 <tr><td>Functional impact</td><td colspan="2">${A.impact!==undefined?esc(["बिल्कुल कोई परेशानी नहीं","थोड़ी परेशानी","काफी परेशानी","बहुत ज्यादा परेशानी"][A.impact]):"Not recorded"}</td></tr>
 </table>
 <p><b>Interpretation:</b> Scores are screening results and should not be treated as a diagnosis. Clinical assessment is required before diagnosis or treatment decisions.</p>
 <button class="btn" onclick="window.print()">Print / Save as PDF</button>`;
}
render();
</script></body></html>
