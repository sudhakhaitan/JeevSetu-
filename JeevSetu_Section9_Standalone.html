<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JeevSetu — Section 9: Physical Activity & Exercise</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:auto;padding:20px;line-height:1.55;background:#f7f7f7}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 2px 10px #ddd}
h1{font-size:24px}.q{font-size:21px;margin:20px 0}
button{font-size:18px;padding:12px 20px;margin:6px;border-radius:8px;border:1px solid #888;background:#fff}
textarea,input{font-size:18px;padding:10px;width:95%;margin:8px 0}
.hidden{display:none}.summary{white-space:pre-wrap;background:#fafafa;padding:15px;border:1px solid #ddd}
</style>
</head>
<body>
<div class="card">
<h1>JeevSetu — Section 9</h1>
<div id="app"></div>
</div>
<script>
const answers={};
let step=0;

const sections=[
 {id:"9.1",q:"आपके रोज़ के काम में कितना चलना-फिरना या शारीरिक मेहनत करनी पड़ती है?",type:"text"},
 {id:"9.2",q:"आपके दिन का कितना समय बैठकर निकलता है और कितना समय चलते-फिरते या काम करते हुए?",type:"text"},
 {id:"9.3",q:"क्या आप अपने रोज़ के काम के अलावा अलग से टहलते हैं या कोई कसरत करते हैं?",type:"yesno",
  yes:[{id:"9.3a",q:"आप क्या करते हैं?",type:"text"},{id:"9.3b",q:"सप्ताह में कितने दिन?",type:"text"},{id:"9.3c",q:"एक दिन में लगभग कितनी देर?",type:"text"}]},
 {id:"9.4",q:"क्या आप ऐसी कोई कसरत करते हैं जिससे शरीर की ताकत बनी रहे या बढ़े?",type:"yesno",
  yes:[{id:"9.4a",q:"जैसे वजन उठाना, रबर की पट्टी से कसरत करना या ऐसी कसरत जिसमें अपने शरीर का वजन इस्तेमाल होता है। आप इनमें से या इनके अलावा क्या करते हैं?",type:"text"}]},
 {id:"9.5",q:"चलते समय या खड़े होते समय क्या कभी आपका शरीर डगमगाता है या आपको गिरने का डर लगता है?",type:"yesno",
  yes:[{id:"9.5a",q:"क्या कभी आप गिरे हैं?",type:"yesno"},
        {id:"9.5b",q:"पिछले एक साल में कितनी बार?",type:"text"}]},
 {id:"9.6",q:"क्या आपके शरीर या जोड़ों में अकड़न रहती है?",type:"yesno",
  yes:[{id:"9.6a",q:"क्या इसे कम करने के लिए कोई कसरत या stretching करते हैं?",type:"text"}]},
 {id:"9.7",q:"क्या पहले की तुलना में अब आपका चलना-फिरना या शारीरिक काम कम हो गया है?",type:"yesno",
  yes:[{id:"9.7a",q:"कब से और क्यों?",type:"text"}]},
 {id:"9.8",q:"चलने, सीढ़ी चढ़ने या कसरत करने पर क्या आपको सांस फूलती है, सीने में दर्द होता है, चक्कर आता है या बहुत ज्यादा थकान होती है?",type:"yesno",clinical:true},
 {id:"9.9",q:"अगर आप अलग से टहलते या कसरत नहीं करते, तो इसकी मुख्य वजह क्या है?",type:"text"},
 {id:"9.10",q:"क्या आप अपने चलने-फिरने या कसरत को थोड़ा बढ़ाना चाहेंगे?",type:"yesno"},
 {id:"9.11",q:"मैंने आपकी रोज़ की physical activity और exercise की जानकारी इस तरह दर्ज की है। क्या यह सही है?",type:"yesno",confirm:true}
];

let current=[], pos=0;

function render(){
 const a=document.getElementById("app");
 if(step>=sections.length){finish();return;}
 const s=sections[step];
 let html='<div class="q"><b>'+s.id+'</b><br>'+s.q+'</div>';
 if(s.type==="yesno") html+='<button onclick="answer(\\'हाँ\\')">हाँ</button><button onclick="answer(\\'नहीं\\')">नहीं</button>';
 else html+='<input id="txt" autocomplete="off"><br><button onclick="textAnswer()">आगे</button>';
 a.innerHTML=html;
}
function answer(v){
 const s=sections[step]; answers[s.id]=v;
 if(v==="हाँ" && s.yes){ current=s.yes; pos=0; askSub(); return; }
 if(s.clinical && v==="हाँ") answers["Clinical Review"]="Required";
 next();
}
function askSub(){
 if(pos>=current.length){next();return;}
 const s=current[pos];
 let html='<div class="q"><b>'+s.id+'</b><br>'+s.q+'</div>';
 if(s.type==="yesno") html+='<button onclick="subAnswer(\\'हाँ\\')">हाँ</button><button onclick="subAnswer(\\'नहीं\\')">नहीं</button>';
 else html+='<input id="txt" autocomplete="off"><br><button onclick="textSub()">आगे</button>';
 document.getElementById("app").innerHTML=html;
}
function subAnswer(v){answers[current[pos].id]=v;pos++;askSub();}
function textSub(){answers[current[pos].id]=document.getElementById("txt").value.trim();pos++;askSub();}
function textAnswer(){answers[sections[step].id]=document.getElementById("txt").value.trim();next();}
function next(){step++;current=[];pos=0;render();}
function finish(){
 let lines=[];
 for(const k of Object.keys(answers)) lines.push(k+": "+answers[k]);
 document.getElementById("app").innerHTML='<h2>Section 9 Complete</h2><div class="summary">'+lines.join("\\n")+'</div><br><button onclick="location.reload()">Start Again</button>';
}
render();
</script>
</body>
</html>
