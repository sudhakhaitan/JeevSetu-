<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JeevSetu AI — Section 5</title>
<style>body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;color:#1f2937}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:white;border-radius:14px;padding:22px;box-shadow:0 2px 10px #0001;margin-bottom:16px}h1{font-size:22px;margin:0 0 4px}h2{font-size:18px}.sub{color:#64748b}.q{font-size:20px;line-height:1.5;margin:18px 0}.options label{display:block;padding:11px;border:1px solid #dbe2ea;border-radius:9px;margin:7px 0}.btn{padding:11px 18px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:16px}.btn.secondary{background:#64748b}.hidden{display:none}.note{background:#eef6ff;padding:12px;border-radius:9px;margin:10px 0}.small{font-size:13px;color:#64748b}</style>
</head>
<body><div class="wrap">
<div class="card"><h1>JeevSetu AI</h1><div class="sub">Section 5 — Past Medical History · Final Frozen Version</div></div>
<div id="app" class="card"></div>
<script>
const diseases=['Diabetes / शुगर','High blood pressure / ब्लड प्रेशर','Heart disease / दिल की बीमारी','Stroke / लकवा','Kidney disease / गुर्दे की बीमारी','Liver disease / लीवर की बीमारी','Thyroid disease / थायरॉइड','Asthma / COPD / दमा या फेफड़ों की बीमारी','Tuberculosis / टीबी','Cancer / कैंसर','Neurological disease / नसों या दिमाग की बीमारी','Arthritis / गठिया','Osteoporosis / हड्डियों का कमजोर होना','Autoimmune disease','Major infection / गंभीर संक्रमण','Obesity / मोटापा','Other chronic disease / कोई दूसरी लंबे समय की बीमारी'];
let selected=[], diseaseIndex=0, data={};
const app=document.getElementById('app');
function renderDiseaseSelect(){app.innerHTML=`<h2>5.1 Previous illnesses</h2><div class="q">क्या आपको पहले कभी इनमें से कोई बीमारी रही है?</div><div class="options">${diseases.map((d,i)=>`<label><input type="checkbox" value="${i}"> ${d}</label>`).join('')}<label><input type="checkbox" id="none"> None / इनमें से कोई नहीं</label></div><button class="btn" onclick="startDiseases()">आगे बढ़ें</button>`;}
function startDiseases(){selected=[...document.querySelectorAll('.options input[type=checkbox]:checked')].map(x=>+x.value); if(document.getElementById('none').checked) selected=[]; diseaseIndex=0; if(selected.length) renderDisease(); else renderTransfusion();}
const diseaseQs=[['Diagnosis','यह बीमारी आपको कब पता चली थी?','text'],['Hospitalisation','क्या इस बीमारी के कारण आपको कभी अस्पताल में भर्ती होना पड़ा था?','yesno'],['Hospital reason','किस कारण से भर्ती होना पड़ा था?','text'],['Hospital date','लगभग कब भर्ती हुए थे?','text'],['Hospital duration','कितने दिन अस्पताल में रहे थे?','text'],['Treatment','इस बीमारी का इलाज कैसे हुआ था?','text'],['Procedure','क्या इस बीमारी के लिए कभी ऑपरेशन या कोई दूसरी प्रक्रिया हुई थी?','yesno'],['Procedure details','कौन-सा ऑपरेशन या प्रक्रिया हुई थी?','text'],['Procedure date','लगभग कब हुई थी?','text'],['Procedure reason','किस कारण से हुई थी?','text'],['ICU','क्या इस बीमारी के कारण आपको कभी ICU में रखना पड़ा था?','yesno'],['Complication','क्या इस बीमारी के कारण आपको कभी कोई बड़ी परेशानी या complication हुई थी?','yesno'],['Complication details','क्या परेशानी हुई थी?','text'],['Current status','क्या यह बीमारी अभी भी है या अब ठीक हो चुकी है?','status'],['Anything else','इस बीमारी के बारे में आपको और कुछ बताना है?','text']];
let qi=0;
function renderDisease(){let d=diseases[selected[diseaseIndex]]; if(qi>=diseaseQs.length){diseaseIndex++;qi=0;if(diseaseIndex<selected.length) return renderDisease(); return renderTransfusion();} let [key,q,type]=diseaseQs[qi]; let input=type==='yesno'?`<div class="options"><label><input type="radio" name="ans" value="Yes"> हाँ</label><label><input type="radio" name="ans" value="No"> नहीं</label></div>`:type==='status'?`<div class="options"><label><input type="radio" name="ans" value="ongoing"> अभी भी है</label><label><input type="radio" name="ans" value="cured"> अब ठीक हो चुकी है</label><label><input type="radio" name="ans" value="unknown"> पता नहीं</label></div>`:`<textarea id="ans" rows="3" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px"></textarea>`; app.innerHTML=`<div class="small">5.2 Disease ${diseaseIndex+1} of ${selected.length}: ${d}</div><div class="q">${q}</div>${input}<br><button class="btn" onclick="saveDisease()">आगे</button>`;}
function saveDisease(){let d=diseases[selected[diseaseIndex]], [key]=diseaseQs[qi]; let el=document.querySelector('#ans')||document.querySelector('input[name=ans]:checked'); data[d]??={}; data[d][key]=el?el.value:''; qi++; // skip conditional questions when answer is No
let last=data[d][key]; if((key==='Hospitalisation'||key==='Procedure'||key==='ICU'||key==='Complication')&&last==='No'){if(key==='Hospitalisation') qi+=3;if(key==='Procedure') qi+=3;if(key==='ICU'){} if(key==='Complication') qi+=1;} renderDisease();}
function renderTransfusion(){app.innerHTML=`<h2>5.3 Blood transfusion history</h2><div class="q">क्या आपको जीवन में कभी खून चढ़ाया गया है?</div><div class="options"><label><input type="radio" name="t" value="No"> नहीं</label><label><input type="radio" name="t" value="Yes"> हाँ</label></div><br><button class="btn" onclick="transfusionNext()">आगे</button>`;}
function transfusionNext(){let v=document.querySelector('input[name=t]:checked')?.value;if(!v)return;if(v==='No')return renderInjury();app.innerHTML=`<h2>5.3 Blood transfusion history</h2><div class="q">खून कब चढ़ाया गया था?</div><input id="tdate" style="width:100%;padding:10px;box-sizing:border-box"><div class="q">किस कारण से खून चढ़ाया गया था?</div><textarea id="treason" rows="2" style="width:100%;box-sizing:border-box"></textarea><div class="q">लगभग कितनी बार खून चढ़ाया गया था?</div><input id="tcount" style="width:100%;padding:10px;box-sizing:border-box"><div class="q">खून चढ़ाने के बाद आपको कोई परेशानी या reaction हुआ था?</div><div class="options"><label><input type="radio" name="tr" value="No"> नहीं</label><label><input type="radio" name="tr" value="Yes"> हाँ</label></div><br><button class="btn" onclick="transfusionReaction()">आगे</button>`;}
function transfusionReaction(){let r=document.querySelector('input[name=tr]:checked')?.value;if(!r)return;if(r==='No')return renderInjury();app.innerHTML=`<h2>5.3 Blood transfusion reaction</h2><div class="q">खून चढ़ाने के बाद आपको क्या परेशानी हुई थी?</div><textarea id="rwhat" rows="3" style="width:100%;box-sizing:border-box"></textarea><div class="q">यह परेशानी खून चढ़ाने के कितने समय बाद हुई थी?</div><input id="rwhen" style="width:100%;padding:10px;box-sizing:border-box"><br><br><button class="btn" onclick="renderInjury()">आगे</button>`;}
const injuryTypes=['Road accident / सड़क दुर्घटना','Fracture / हड्डी टूटना','Head injury / सिर की चोट','Drowning in river / नदी में डूबना'];
let selectedInjuries=[], injuryIndex=0;
function renderInjury(){app.innerHTML=`<h2>5.4 Major injury / accident</h2><div class="q">क्या आपको कभी कोई बड़ी चोट या accident हुआ है?</div><div class="options"><label><input type="radio" name="i" value="No"> नहीं</label><label><input type="radio" name="i" value="Yes"> हाँ</label></div><br><button class="btn" onclick="injuryNext()">आगे</button>`;}
function injuryNext(){let v=document.querySelector('input[name=i]:checked')?.value;if(!v)return;if(v==='No')return renderAnaesthesia();app.innerHTML=`<h2>5.4 Major injury / accident</h2><div class="q">आपको किस प्रकार की बड़ी चोट या accident हुआ था?</div><select id="injurySelect" multiple size="5" style="width:100%;padding:10px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px">${injuryTypes.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}<option value="other">Other major injury / दूसरी गंभीर चोट</option></select><div class="small">एक या एक से अधिक विकल्प चुन सकते हैं।</div><br><button class="btn" onclick="startInjuryDetails()">आगे</button>`;}
function startInjuryDetails(){selectedInjuries=[...document.querySelectorAll('#injurySelect option:checked')].map(x=>x.value);if(!selectedInjuries.length)return;injuryIndex=0;renderInjuryDetails();}
function renderInjuryDetails(){let label=selectedInjuries[injuryIndex]==='other'?'Other major injury / दूसरी गंभीर चोट':injuryTypes[+selectedInjuries[injuryIndex]];app.innerHTML=`<div class="small">5.4 Injury ${injuryIndex+1} of ${selectedInjuries.length}: ${label}</div><div class="q">कृपया इस चोट या accident के बारे में बताएं।</div><textarea id="injDetails" rows="4" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px"></textarea><div class="q">यह कब हुआ था?</div><input id="injWhen" style="width:100%;padding:10px;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px"><div class="q">क्या आपको अस्पताल में भर्ती होना पड़ा था?</div><div class="options"><label><input type="radio" name="injHosp" value="Yes"> हाँ</label><label><input type="radio" name="injHosp" value="No"> नहीं</label></div><br><button class="btn" onclick="saveInjuryDetail()">आगे</button>`;}
function saveInjuryDetail(){let h=document.querySelector('input[name=injHosp]:checked')?.value;if(!h)return;injuryIndex++;if(injuryIndex<selectedInjuries.length)return renderInjuryDetails();return renderAnaesthesia();}
function renderAnaesthesia(){app.innerHTML=`<h2>5.5 Anaesthesia history</h2><div class="q">क्या आपको कभी किसी operation या procedure के दौरान बेहोशी की दवा (anaesthesia) दी गई थी?</div><div class="options"><label><input type="radio" name="a" value="No"> नहीं</label><label><input type="radio" name="a" value="Yes"> हाँ</label></div><br><button class="btn" onclick="anaNext()">आगे</button>`;}
function anaNext(){let v=document.querySelector('input[name=a]:checked')?.value;if(!v)return;if(v==='No')return renderInvestigations();app.innerHTML=`<h2>5.5 Anaesthesia history</h2><div class="q">उसके बाद आपको कोई परेशानी या reaction हुआ था?</div><textarea id="ana" rows="3" style="width:100%;box-sizing:border-box"></textarea><br><br><button class="btn" onclick="renderInvestigations()">आगे</button>`;}
function renderInvestigations(){app.innerHTML=`<h2>5.6 Previous abnormal investigations</h2><div class="q">क्या पहले कभी किसी blood test, scan, X-ray या दूसरी जांच में कोई महत्वपूर्ण गड़बड़ी बताई गई थी?</div><div class="options"><label><input type="radio" name="x" value="No"> नहीं</label><label><input type="radio" name="x" value="Yes"> हाँ</label></div><br><button class="btn" onclick="invNext()">आगे</button>`;}
function invNext(){let v=document.querySelector('input[name=x]:checked')?.value;if(!v)return;if(v==='No')return renderCured();app.innerHTML=`<h2>5.6 Previous abnormal investigations</h2><div class="q">कौन-सी जांच थी और क्या गड़बड़ी बताई गई थी?</div><textarea rows="4" style="width:100%;box-sizing:border-box"></textarea><br><br><button class="btn" onclick="renderCured()">आगे</button>`;}
function renderCured(){app.innerHTML=`<h2>5.7 Previous illness considered cured</h2><div class="q">क्या आपको पहले कोई ऐसी बीमारी थी जो अब ठीक हो चुकी है, लेकिन आपको लगता है कि डॉक्टर को उसके बारे में जानना चाहिए?</div><div class="options"><label><input type="radio" name="c" value="No"> नहीं</label><label><input type="radio" name="c" value="Yes"> हाँ</label></div><br><button class="btn" onclick="curedNext()">आगे</button>`;}
function curedNext(){let v=document.querySelector('input[name=c]:checked')?.value;if(!v)return;if(v==='No')return renderOther();app.innerHTML=`<h2>5.7 Previous illness considered cured</h2><div class="q">कृपया बीमारी और उसके बारे में महत्वपूर्ण जानकारी बताएं।</div><textarea rows="4" style="width:100%;box-sizing:border-box"></textarea><br><br><button class="btn" onclick="renderOther()">आगे</button>`;}
function renderOther(){app.innerHTML=`<h2>5.8 Other important medical information</h2><div class="q">क्या आपकी पिछली बीमारी या इलाज से जुड़ी कोई और महत्वपूर्ण बात है जो आपने अभी नहीं बताई?</div><textarea id="otherInfo" rows="4" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px"></textarea><br><br><button class="btn" onclick="saveOther()">आगे</button>`;}
function saveOther(){data.otherImportant=document.getElementById('otherInfo')?.value||'';renderConfirm();}
function renderConfirm(){app.innerHTML=`<h2>5.9 Final confirmation</h2><div class="q">क्या आपने अपनी पुरानी बीमारियों, अस्पताल में भर्ती होने, ऑपरेशन, चोट, खून चढ़ने और दूसरी महत्वपूर्ण स्वास्थ्य संबंधी जानकारी पूरी तरह बता दी है?</div><div class="options"><label><input type="radio" name="f" value="Yes"> हाँ</label><label><input type="radio" name="f" value="No"> नहीं</label></div><br><button class="btn" onclick="finish()">आगे</button>`;}
function finish(){let v=document.querySelector('input[name=f]:checked')?.value;if(!v)return;data.finalConfirmation=v;if(v==='No')return renderFinalAdditional();renderClinicalNote();}
function renderFinalAdditional(){app.innerHTML=`<h2>5.9 Additional information</h2><div class="q">कृपया वह अतिरिक्त जानकारी बताएं जो अभी छूट गई है।</div><textarea id="finalAdditional" rows="5" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px"></textarea><br><br><button class="btn" onclick="saveFinalAdditional()">आगे</button>`;}
function saveFinalAdditional(){data.finalAdditional=document.getElementById('finalAdditional')?.value||'';renderClinicalNote();}
function renderClinicalNote(){let lines=[];lines.push('SECTION 5 — PAST MEDICAL HISTORY');if(Object.keys(data).length){if(data.otherImportant)lines.push('Other important medical information: '+data.otherImportant);if(data.finalConfirmation)lines.push('Final confirmation: '+(data.finalConfirmation==='Yes'?'Yes':'No'));if(data.finalAdditional)lines.push('Additional information: '+data.finalAdditional);Object.keys(data).filter(k=>!['otherImportant','finalConfirmation','finalAdditional'].includes(k)).forEach(k=>{let v=data[k];if(typeof v==='object'){let parts=[];Object.keys(v).forEach(x=>{if(v[x])parts.push(x+': '+v[x])});if(parts.length)lines.push(k+' — '+parts.join('; '));}else if(v)lines.push(k+': '+v);});}app.innerHTML=`<h2>Clinical Note</h2><div class="note" style="white-space:pre-wrap;line-height:1.6">${escapeHtml(lines.join('\n'))}</div><button class="btn secondary" onclick="renderDiseaseSelect()">Restart Section 5</button>`;}
function escapeHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');}
renderDiseaseSelect();
</script></div></body></html>
