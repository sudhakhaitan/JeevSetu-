<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JeevSetu Section 11</title><style>body{font-family:Arial;max-width:820px;margin:auto;padding:18px;background:#f4f6f8} .card{background:white;padding:22px;border-radius:14px}.q{font-size:21px;margin:20px 0}.btn{font-size:18px;padding:11px 20px;margin:6px;border-radius:8px}input{font-size:18px;padding:10px;width:90%}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left}.flag{padding:12px;background:#fff4f4;border-left:5px solid #b00020}.ok{padding:12px;background:#f3faf6;border-left:5px solid #26734d}</style></head><body><div class="card"><h1>JeevSetu — Section 11<br>Ayurveda Interest & Readiness</h1><div id="app"></div></div><script>
const A={};let i=0,sub=[],p=0;const S=[
{id:'11.1',q:'क्या आपने पहले कभी आयुर्वेदिक इलाज या दवा ली है?',t:'yn',yes:[{id:'11.1a',q:'किस समस्या के लिए लिया था?',t:'text'},{id:'11.1b',q:'आपको उससे कैसा अनुभव हुआ?',t:'text'},{id:'11.1c',q:'क्या आप अभी कोई आयुर्वेदिक दवा ले रहे हैं?',t:'yn'}]},
{id:'11.2',q:'क्या आप अपने स्वास्थ्य के लिए आयुर्वेदिक उपचार या सलाह लेना चाहेंगे?',t:'yn'},
{id:'11.3',q:'आप आयुर्वेद से किस समस्या या स्वास्थ्य उद्देश्य के लिए मदद लेना चाहेंगे?',t:'text',if:['11.2','हाँ']},
{id:'11.4',q:'आप आयुर्वेद में किस तरह की सलाह लेना पसंद करेंगे—दवा, आहार, दिनचर्या, या इनके बारे में जानकारी?',t:'choice',o:['दवा','आहार','दिनचर्या','इनके बारे में जानकारी'],if:['11.2','हाँ']},
{id:'11.5',q:'क्या आयुर्वेदिक दवा या उपचार से पहले कभी आपको कोई परेशानी हुई है?',t:'yn',if:['11.2','हाँ'],yes:[{id:'11.5a',q:'कृपया बताइए कि क्या परेशानी हुई थी।',t:'text'}]},
{id:'11.6',q:'मैंने आयुर्वेद के बारे में आपकी रुचि और अनुभव की जानकारी दर्ज की है। क्या यह सही है?',t:'confirm'}];
const L={'11.1':'Previous Ayurveda treatment/medicine','11.1a':'Reason for previous Ayurveda use','11.1b':'Experience with previous Ayurveda','11.1c':'Currently taking Ayurvedic medicine','11.2':'Interest in Ayurveda','11.3':'Purpose / health objective','11.4':'Preferred Ayurveda advice','11.5':'Previous problem with Ayurvedic treatment/medicine','11.5a':'Problem details','11.6':'Patient confirmation'};
const e=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const ok=s=>!s.if||A[s.if[0]]===s.if[1];
function render(){if(i>=S.length)return report();let s=S[i];if(!ok(s)){i++;return render()}if(s.t==='confirm')return confirm();let h='<div class="q"><b>'+s.id+'</b><br>'+e(s.q)+'</div>';if(s.t==='yn')h+='<button class="btn" onclick="ans(\'हाँ\')">हाँ</button><button class="btn" onclick="ans(\'नहीं\')">नहीं</button>';else if(s.t==='choice')s.o.forEach(x=>h+='<button class="btn" onclick="ans(\''+x+'\')">'+e(x)+'</button>');else h+='<input id="x"><br><button class="btn" onclick="txt()">आगे</button>';app.innerHTML=h;let x=document.getElementById('x');if(x)x.focus()}
function ans(v){let s=S[i];A[s.id]=v;if(v==='हाँ'&&s.yes){sub=s.yes;p=0;ask();}else next()}function ask(){while(p<sub.length&&!ok(sub[p]))p++;if(p>=sub.length)return next();let s=sub[p],h='<div class="q"><b>'+s.id+'</b><br>'+e(s.q)+'</div>';if(s.t==='yn')h+='<button class="btn" onclick="sa(\'हाँ\')">हाँ</button><button class="btn" onclick="sa(\'नहीं\')">नहीं</button>';else h+='<input id="x"><br><button class="btn" onclick="st()">आगे</button>';app.innerHTML=h;let x=document.getElementById('x');if(x)x.focus()}function sa(v){A[sub[p].id]=v;p++;ask()}function st(){A[sub[p].id]=document.getElementById('x').value.trim();p++;ask()}function txt(){A[S[i].id]=document.getElementById('x').value.trim();next()}function next(){i++;sub=[];p=0;render()}
function summary(){let r='';Object.keys(L).forEach(k=>{if(k!=='11.6'&&A[k]!==undefined)r+='<tr><th>'+e(L[k])+'</th><td>'+e(A[k])+'</td></tr>'});return '<table>'+r+'</table>'}function confirm(){app.innerHTML='<div class="q"><b>11.6</b><br>'+e(S[S.length-1].q)+'</div>'+summary()+'<button class="btn" onclick="cr(\'हाँ\')">हाँ</button><button class="btn" onclick="cr(\'नहीं\')">नहीं</button>'}function cr(v){A['11.6']=v;if(v==='हाँ')report();else app.innerHTML='<div class="flag"><b>कृपया जानकारी की जाँच करें।</b><br>Section 11 को फिर से शुरू करके सही जानकारी दर्ज करें।</div><button class="btn" onclick="location.reload()">Section 11 फिर से शुरू करें</button>'}
function report(){let r='';Object.keys(L).forEach(k=>{if(A[k]!==undefined)r+='<tr><th>'+e(L[k])+'</th><td>'+e(A[k])+'</td></tr>'});let n=A['11.2']!=='हाँ';app.innerHTML='<h2>Clinician Report — Ayurveda Interest & Readiness</h2>'+(n?'<div class="flag"><b>Ayurveda interest: Not interested</b><br><b>Do not suggest an Ayurveda treatment pathway from this section.</b></div>':'<div class="ok"><b>Ayurveda interest: Interested</b><br>Ayurvedic care may be discussed according to the patient’s stated interest and clinical context.</div>')+'<table>'+r+'</table><p><b>Patient confirmation:</b> '+e(A['11.6']||'Not recorded')+'</p><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn" onclick="location.reload()">Start Again</button>'}render();</script></div></body></html>
