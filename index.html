<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JeevSetu — Section 17</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:auto;padding:18px;background:#f7f7f7;color:#222}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0001}
h1{font-size:22px} h2{font-size:18px;margin-top:8px}
.q{font-size:20px;line-height:1.55;margin:20px 0}
button{padding:12px 18px;margin:5px;border:0;border-radius:9px;background:#2457a6;color:white;font-size:16px}
button.secondary{background:#777}.hidden{display:none}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;font-size:17px;margin:8px 0;border:1px solid #bbb;border-radius:8px}
.flag{background:#ffe0e0;border:2px solid #c33;padding:14px;border-radius:10px}
.note{white-space:pre-wrap;background:#fafafa;padding:14px;border-radius:8px;border:1px solid #ddd}
</style>
</head>
<body>
<div class="card">
<h1>SECTION 17 — REPRODUCTIVE, SEXUAL, OBSTETRIC & FERTILITY HISTORY</h1>
<div id="app"></div>
</div>
<script>
const A=[];
let i=0, sex="", age=null, pregnancyFlag=false;
const app=document.getElementById("app");
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(q, buttons=[], input=false, type="text"){
  app.innerHTML=`<div class="q">${q}</div>`+
    (input?`<input id="ans" type="${type}" inputmode="${type==="number"?"numeric":"text"}" autofocus>
     <button onclick="saveInput()">आगे बढ़ें</button>`:"")+
    buttons.map((b,n)=>`<button onclick="answer(${n})">${esc(b)}</button>`).join("");
  window._buttons=buttons;
}
function answer(n){
  const v=window._buttons[n];
  A.push({q:window._q,a:v});
  if(window._q==="रोगी का लिंग") sex=v;
  next();
}
function saveInput(){
 const x=document.getElementById("ans");
 if(!x||!x.value.trim()){ alert("कृपया उत्तर दर्ज करें।"); return; }
 const v=x.value.trim();
 A.push({q:window._q,a:v});
 if(window._q==="रोगी की उम्र") age=parseInt(v,10);
 next();
}
function ask(q,buttons=[],input=false,type="text"){
 window._q=q; render(q,buttons,input,type);
 if(input){
   setTimeout(()=>{const x=document.getElementById("ans"); if(x)x.addEventListener("keydown",e=>{if(e.key==="Enter")saveInput();});},0);
 }
}
function next(){
 i++;
 if(i===1)return ask('अब मैं स्वास्थ्य से जुड़ी कुछ निजी जानकारी के बारे में पूछूंगा। ये प्रश्न आपकी चिकित्सा देखभाल के लिए हैं। अगर किसी प्रश्न का उत्तर आप नहीं देना चाहते हैं, तो आप ऐसा बता सकते हैं।',['सहमत — आगे बढ़ें','नहीं देना चाहता/चाहती'],false);
 if(i===2)return ask('रोगी का लिंग',['महिला','पुरुष','अन्य / बताना नहीं']);
 if(i===3)return ask('रोगी की उम्र',[],true,'number');
 if(i===4 && sex==='महिला')return ask('क्या आपकी माहवारी अभी आती है?',['हाँ','नहीं','लागू नहीं']);
 if(i===4 && sex!=='महिला') { i=9; return next(); }
 if(i===5)return ask('आपकी आखिरी माहवारी कब शुरू हुई थी?',['तारीख नहीं मालूम'],true);
 if(i===6)return ask('आमतौर पर कितने दिनों के अंतर पर आती है?',[],true,'number');
 if(i===7)return ask('कितने दिनों तक रहती है?',[],true,'number');
 if(i===8)return ask('Bleeding सामान्य रहती है या बहुत ज्यादा होती है?',['सामान्य','बहुत ज्यादा','अनिश्चित']);
 if(i===9)return ask('क्या माहवारी के समय बहुत ज्यादा दर्द होता है?',['हाँ','नहीं']);
 if(i===10)return ask('क्या आपकी माहवारी पूरी तरह बंद हो चुकी है?',['हाँ','नहीं','लागू नहीं']);
 if(i===11)return ask('लगभग किस उम्र में बंद हुई?',[],true,'number');
 if(i===12)return ask('माहवारी बंद होने के बाद क्या अचानक गर्मी लगना, बहुत पसीना आना, नींद में परेशानी या दूसरी परेशानी हुई?',['हाँ','नहीं']);
 if(i===13)return ask('आपकी शादी कब हुई थी?',['लागू नहीं / बताना नहीं'],true);
 if(i===14)return ask('शादी के बाद पहला बच्चा कब हुआ था?',['अभी कोई बच्चा नहीं','लागू नहीं / बताना नहीं'],true);
 if(i===15)return ask('शादी के बाद बच्चे के लिए आपने कुछ समय तक pregnancy नहीं चाही थी, या आप pregnancy चाहते थे लेकिन pregnancy नहीं हो पा रही थी?',['कुछ समय pregnancy नहीं चाही थी','Pregnancy चाहते थे लेकिन नहीं हो रही थी','दोनों / स्पष्ट नहीं','लागू नहीं']);
 if(i===16)return ask('जब आपने pregnancy की कोशिश शुरू की थी, तब लगभग कितने समय तक pregnancy नहीं हुई?',['6 महीने से कम','6–12 महीने','1–2 साल','2 साल से अधिक','याद नहीं','लागू नहीं']);
 if(i===17)return ask('क्या आपने इस बारे में किसी डॉक्टर से सलाह ली थी?',['हाँ','नहीं','लागू नहीं']);
 if(i===18)return ask('क्या fertility के लिए कोई जांच कराई थी?',['हाँ','नहीं','याद नहीं']);
 if(i===19)return ask('क्या fertility के लिए कोई treatment लिया था?',['हाँ','नहीं','लागू नहीं']);
 if(i===20)return ask('क्या कभी IVF या test-tube baby के लिए treatment कराया था?',['हाँ','नहीं','लागू नहीं']);
 if(i===21)return ask('IVF कितनी बार कराया था?',['1 बार','2 बार','3 बार','3 से अधिक','याद नहीं','लागू नहीं']);
 if(i===22)return ask('उससे pregnancy हुई थी?',['हाँ','नहीं','याद नहीं','लागू नहीं']);
 if(i===23)return ask('क्या कोई बच्चा हुआ?',['हाँ','नहीं','लागू नहीं']);
 if(i===24)return ask('क्या डॉक्टर ने कभी बताया था कि pregnancy में परेशानी आपकी तरफ से, आपके पति या पत्नी की तरफ से, या दोनों तरफ से हो सकती है?',['आपकी तरफ से','पति/पत्नी की तरफ से','दोनों तरफ से','कारण स्पष्ट नहीं बताया','पता नहीं','लागू नहीं']);
 if(i===25)return ask('क्या आपको कभी pregnancy हुई है?',['हाँ','नहीं','लागू नहीं']);
 if(i===26)return ask('कुल कितनी pregnancies हुई थीं?',[],true,'number');
 if(i===27)return ask('Pregnancy/गर्भ का वर्ष और outcome बताइए। उदाहरण: 2018 — सामान्य delivery; 2020 — miscarriage',[],true);
 if(i===28)return ask('क्या किसी pregnancy में delivery Caesarean हुई थी?',['हाँ','नहीं','लागू नहीं']);
 if(i===29)return ask('क्या किसी pregnancy में miscarriage, stillbirth या termination हुआ था?',['हाँ','नहीं','लागू नहीं']);
 if(i===30)return ask('किसी pregnancy में कोई बड़ी complication हुई थी?',['हाँ','नहीं']);
 if(i===31)return ask('किसी pregnancy के दौरान आपका blood pressure बढ़ गया था या डॉक्टर ने hypertension बताया था?',['हाँ','नहीं','लागू नहीं']);
 if(i===32)return ask('किस pregnancy में? और क्या दवा लेनी पड़ी थी?',[],true);
 if(i===33)return ask('Delivery के बाद blood pressure सामान्य हो गया था या बाद में भी चलता रहा?',['सामान्य हो गया','बाद में भी चलता रहा','पता नहीं','लागू नहीं']);
 if(i===34)return ask('क्या किसी pregnancy के दौरान आपका blood sugar बढ़ गया था या डॉक्टर ने बताया था कि pregnancy में sugar बढ़ी हुई है?',['हाँ','नहीं','लागू नहीं']);
 if(i===35)return ask('क्या इसके लिए दवा, insulin या विशेष diet दी गई थी?',['हाँ','नहीं','याद नहीं','लागू नहीं']);
 if(i===36)return ask('बच्चे के जन्म के बाद sugar सामान्य हो गई थी?',['हाँ','नहीं','पता नहीं','लागू नहीं']);
 if(i===37)return ask('किसी pregnancy में कोई दूसरी बड़ी परेशानी हुई थी?',['हाँ','नहीं','लागू नहीं']);
 if(i===38)return ask('आपके कितने बच्चे हैं?',[],true,'number');
 if(i===39)return ask('क्या किसी बच्चे को जन्म के समय या बाद में कोई बड़ी स्वास्थ्य समस्या हुई थी?',['हाँ','नहीं']);
 if(i===40)return ask('क्या आप अभी pregnancy से बचने के लिए कोई तरीका इस्तेमाल करते हैं?',['हाँ','नहीं','लागू नहीं']);
 if(i===41)return ask('क्या अभी pregnancy होने की संभावना है?',['हाँ','नहीं','पता नहीं / अनिश्चित']);
 if(i===42)return ask('क्या आप अभी बच्चे को अपना दूध पिला रही हैं?',['हाँ','नहीं','लागू नहीं']);
 if(i===43)return ask('क्या आपकी वर्तमान स्वास्थ्य समस्या से जुड़ी कोई यौन या वैवाहिक परेशानी है जिसके बारे में आप डॉक्टर को बताना चाहेंगे?',['हाँ','नहीं','बताना नहीं','लागू नहीं']);
 if(i===44 && sex==='पुरुष')return ask('क्या आपको पेशाब या यौन संबंध से जुड़ी कोई ऐसी परेशानी है जिसके बारे में आप डॉक्टर को बताना चाहेंगे?',['हाँ','नहीं','बताना नहीं']);
 if(i===45 && sex==='पुरुष')return ask('कृपया बताएं: erectile difficulty, reduced desire, ejaculation problem, infertility, genital symptoms, infection या अन्य',[],true);
 if((i===44 && sex!=='पुरुष')||(i===46 && sex==='पुरुष')) return confirm();
 if(i>=46) return confirm();
 return confirm();
}
function confirm(){
 app.innerHTML='<div class="q">मैंने आपकी reproductive और pregnancy से जुड़ी जानकारी दर्ज की है। क्या इसमें कोई गलती है या कोई महत्वपूर्ण बात छूट गई है?</div><button onclick="finish()">हाँ, सब ठीक है</button><button class="secondary" onclick="finish()">सुधार/अतिरिक्त जानकारी दर्ज करें</button>';
}
function finish(){
 const text=A.map(x=>x.q+" — "+x.a).join("\\n");
 let note="SECTION 17 — REPRODUCTIVE, SEXUAL, OBSTETRIC & FERTILITY HISTORY\\n\\n"+text;
 if(A.some(x=>x.a==="हाँ" && x.q.includes("pregnancy होने की संभावना"))) pregnancyFlag=true;
 app.innerHTML='<h2>Clinical Note Preview</h2>'+(pregnancyFlag?'<div class="flag"><b>CLINICIAN FLAG:</b> Current pregnancy possible/uncertain — clinician review required.</div>':'')+
 '<div class="note">'+esc(note)+'</div><button onclick="copyNote()">Copy Clinical Note</button>';
 window.note=note;
}
function copyNote(){navigator.clipboard?.writeText(window.note);alert("Clinical note copied.");}
next();
</script>
</body>
</html>
