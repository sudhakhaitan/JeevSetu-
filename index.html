<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JeevSetu Section 14 — Dietary History</title><style>body{font-family:Arial;max-width:820px;margin:auto;padding:18px;background:#f4f6f8}.card{background:white;padding:22px;border-radius:14px}.q{font-size:21px;margin:20px 0}.btn{font-size:18px;padding:11px 20px;margin:6px;border-radius:8px}input,textarea{font-size:18px;padding:10px;width:90%;box-sizing:border-box}textarea{min-height:100px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}.flag{padding:12px;background:#fff4f4;border-left:5px solid #b00020}.ok{padding:12px;background:#f3faf6;border-left:5px solid #26734d}.note{font-size:15px;color:#555}</style></head><body><div class="card"><h1>JeevSetu — Section 14<br>Dietary History</h1><div id="app"></div></div><script>
const app=document.getElementById('app');const A={};let i=0;
const S=[
{id:'14.1',q:'आप आमतौर पर किस तरह का खाना खाते हैं?',t:'text'},
{id:'14.1a',q:'आप शाकाहारी हैं, मांसाहारी हैं, अंडा खाते हैं या vegan हैं?',t:'choice',opts:['शाकाहारी','मांसाहारी','अंडा खाते हैं','Vegan','अन्य']},
{id:'14.2',q:'आप सुबह उठने से लेकर रात तक एक सामान्य दिन में क्या-क्या खाते और पीते हैं? अपने रोज़ के खाने के बारे में बताइए।',t:'text'},
{id:'14.3',q:'सुबह नाश्ते में आमतौर पर क्या लेते हैं?',t:'text'},
{id:'14.4',q:'दोपहर के खाने में आमतौर पर क्या लेते हैं?',t:'text'},
{id:'14.5',q:'रात के खाने में आमतौर पर क्या लेते हैं?',t:'text'},
{id:'14.5a',q:'रात का खाना लगभग कितने बजे खाते हैं?',t:'text'},
{id:'14.6',q:'खाने के बीच में कुछ खाते-पीते हैं?',t:'yn'},
{id:'14.6a',q:'आमतौर पर क्या लेते हैं?',t:'text',if:['14.6','हाँ']},
{id:'14.7',q:'दिन में चाय या coffee कितनी बार लेते हैं?',t:'text'},
{id:'14.7a',q:'चीनी कितनी डालते हैं?',t:'text'},
{id:'14.8',q:'दिनभर में लगभग कितना पानी पीते हैं?',t:'text'},
{id:'14.9',q:'आप रोज़ कौन-कौन सी सब्जियां खाते हैं?',t:'text'},
{id:'14.9a',q:'फल कितनी बार खाते हैं?',t:'text'},
{id:'14.10',q:'आपके रोज़ के खाने में दाल, चना, राजमा, सोयाबीन, दूध, दही, पनीर, अंडा, मछली या मांस में से क्या-क्या शामिल रहता है?',t:'text'},
{id:'14.10a',q:'इनमें से कौन-सी चीज़ आप सबसे ज्यादा खाते हैं?',t:'text'},
{id:'14.11',q:'क्या आप दूध या दूध से बनी चीज़ें लेते हैं?',t:'yn'},
{id:'14.11a',q:'कौन-कौन सी चीज़ें और कितनी बार लेते हैं?',t:'text',if:['14.11','हाँ']},
{id:'14.12',q:'घर में खाना बनाने के लिए कौन सा तेल या घी इस्तेमाल होता है?',t:'text'},
{id:'14.13',q:'खाना आमतौर पर तला हुआ, भुना हुआ, उबला हुआ या किसी और तरीके से बनता है?',t:'text'},
{id:'14.14',q:'क्या आपको खाने में नमक ज्यादा पसंद है?',t:'yn'},
{id:'14.14a',q:'क्या आप खाने या चाय में चीनी ज्यादा लेते हैं?',t:'yn'},
{id:'14.15',q:'क्या आप बाजार की packaged या तैयार चीजें अक्सर खाते हैं?',t:'yn'},
{id:'14.15a',q:'इनमें से क्या-क्या लेते हैं—biscuits, namkeen, chips, sweets, bakery products, sugary drinks या दूसरी तैयार चीजें?',t:'text',if:['14.15','हाँ']},
{id:'14.16',q:'क्या आप रोज़ लगभग एक ही समय पर खाना खाते हैं या समय बदलता रहता है?',t:'text'},
{id:'14.17',q:'क्या आप किसी खास वजह से कोई खाना नहीं खाते?',t:'yn'},
{id:'14.17a',q:'किस वजह से और कौन-सा खाना नहीं खाते?',t:'text',if:['14.17','हाँ']},
{id:'14.18',q:'क्या आप नियमित रूप से व्रत या उपवास रखते हैं?',t:'yn'},
{id:'14.18a',q:'आप कितनी बार व्रत रखते हैं?',t:'text',if:['14.18','हाँ']},
{id:'14.18b',q:'व्रत में आप पूरे दिन कुछ नहीं खाते हैं या फल, दूध, चाय या दूसरी चीजें लेते हैं?',t:'text',if:['14.18','हाँ']},
{id:'14.19',q:'व्रत खोलने के बाद आप आमतौर पर क्या खाते-पीते हैं?',t:'text',if:['14.18','हाँ']},
{id:'14.19a',q:'लगभग किस समय खाना खाते हैं?',t:'text',if:['14.18','हाँ']},
{id:'14.19b',q:'क्या उस समय आपका खाना सामान्य दिनों की तुलना में ज्यादा हो जाता है?',t:'yn',if:['14.18','हाँ']},
{id:'14.20',q:'व्रत वाले दिन आप अपनी दवाइयां किस समय लेते हैं?',t:'text',if:['14.18','हाँ']},
{id:'14.20a',q:'क्या कभी व्रत की वजह से आपने कोई दवा छोड़ दी या समय बदल दिया?',t:'yn',if:['14.18','हाँ']},
{id:'14.21',q:'क्या व्रत रखने वाले दिन आपकी कोई परेशानी बढ़ जाती है—जैसे कमजोरी, चक्कर, सिरदर्द, acidity या बहुत ज्यादा भूख?',t:'yn',if:['14.18','हाँ']},
{id:'14.21a',q:'कौन-सी परेशानी बढ़ती है?',t:'text',if:['14.21','हाँ']},
{id:'14.21b',q:'व्रत खोलने के बाद ज्यादा खाना खाने पर कोई परेशानी होती है?',t:'text',if:['14.18','हाँ']},
{id:'14.22',q:'क्या आपके खाने-पीने में किसी धार्मिक या पारंपरिक रीति की वजह से कोई खास नियम है?',t:'yn'},
{id:'14.22a',q:'कौन-सा नियम या परंपरा?',t:'text',if:['14.22','हाँ']},
{id:'14.23',q:'क्या कभी पैसे या उपलब्धता की वजह से ऐसा होता है कि आप अपनी जरूरत का खाना नहीं ले पाते?',t:'yn'},
{id:'14.23a',q:'किस तरह की परेशानी होती है?',t:'text',if:['14.23','हाँ']},
{id:'14.24',q:'क्या आप अपने खाने के अलावा कोई vitamin, mineral, protein powder या दूसरा supplement लेते हैं?',t:'yn'},
{id:'14.24a',q:'Supplement की विस्तृत जानकारी Section 6 में ली गई है। क्या आप पुष्टि करते हैं कि वही जानकारी dietary history के साथ जोड़ी जाए?',t:'yn',if:['14.24','हाँ']},
{id:'14.25',q:'मैंने आपके रोज़ के खाने-पीने की जानकारी इस तरह समझी है। क्या इसमें कोई गलती है या कोई महत्वपूर्ण चीज़ छूट गई है?',t:'confirm'}];
const L={};S.forEach(s=>L[s.id]=s.q);
function ok(s){if(!s.if)return true;return A[s.if[0]]===s.if[1]}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){while(i<S.length&&!ok(S[i]))i++;if(i>=S.length)return confirm();let s=S[i];if(s.t==='confirm')return confirm();let h='<div class="q"><b>'+s.id+'</b><br>'+esc(s.q)+'</div>';if(s.t==='yn')h+='<button class="btn" onclick="ans(\'हाँ\')">हाँ</button><button class="btn" onclick="ans(\'नहीं\')">नहीं</button>';else if(s.t==='choice')h+=s.opts.map(o=>'<button class="btn" onclick="ans(\''+esc(o).replace(/'/g,"\\'")+'\')">'+esc(o)+'</button>').join('');else h+='<textarea id="x"></textarea><br><button class="btn" onclick="txt()">आगे</button>';app.innerHTML=h;let x=document.getElementById('x');if(x)x.focus()}
function ans(v){A[S[i].id]=v;next()}function txt(){A[S[i].id]=document.getElementById('x').value.trim();next()}function next(){i++;render()}
function summary(){let r='';Object.keys(A).forEach(k=>{if(k==='14.25')return;r+='<tr><th>'+esc(L[k]||k)+'</th><td>'+esc(A[k])+'</td></tr>'});return '<table>'+r+'</table>'}
function confirm(){app.innerHTML='<div class="q"><b>14.25</b><br>'+esc(S[S.length-1].q)+'</div>'+summary()+'<button class="btn" onclick="finish(\'हाँ\')">हाँ — Clinical Note बनाएं</button><button class="btn" onclick="finish(\'नहीं\')">नहीं</button>'}
function finish(v){A['14.25']=v;if(v==='हाँ')report();else app.innerHTML='<div class="flag"><b>कृपया जानकारी की जाँच करें।</b></div><button class="btn" onclick="location.reload()">Section 14 फिर से शुरू करें</button>'}
function report(){let alerts=[];if(A['14.20a']==='हाँ')alerts.push('Medication timing or omission during fasting reported.');if(A['14.21']==='हाँ')alerts.push('Symptoms increase on fasting days.');if(A['14.23']==='हाँ')alerts.push('Food affordability/availability limitation reported.');let status=alerts.length?'<div class="flag"><b>Clinician attention:</b><br>'+alerts.map(esc).join('<br>')+'</div>':'<div class="ok"><b>Dietary history recorded.</b></div>';app.innerHTML='<h2>Clinician Report — Section 14: Dietary History</h2>'+status+'<p><b>Dietary pattern:</b> '+esc(A['14.1a']||'Not recorded')+'<br><b>Fasting/Vrat:</b> '+esc(A['14.18']||'Not recorded')+'<br><b>Supplements:</b> '+esc(A['14.24']||'Not recorded')+'<br><b>Confirmation:</b> '+esc(A['14.25']||'Not recorded')+'</p>'+summary()+'<button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn" onclick="location.reload()">Start Again</button>'}
render();</script></div></body></html>
