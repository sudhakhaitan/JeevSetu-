<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JeevSetu — Section 10: Yoga Readiness & Interest</title>
<style>
body{font-family:Arial,sans-serif;max-width:820px;margin:auto;padding:18px;line-height:1.55;background:#f4f6f8;color:#222}
.card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px #ddd}
h1{font-size:24px}.q{font-size:21px;margin:20px 0}.small{font-size:15px;color:#666}
.btn{font-size:18px;padding:11px 20px;margin:6px;border-radius:8px;border:1px solid #888;background:#fff}
.btn:active{transform:scale(.98)}input{font-size:18px;padding:10px;width:90%;max-width:650px}
.report h2{margin-bottom:6px}.report table{width:100%;border-collapse:collapse;margin:12px 0}
.report th,.report td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}.report th{background:#f0f2f4}
.flag{border-left:5px solid #b00020;padding:10px;background:#fff4f4;margin:10px 0}
.ok{border-left:5px solid #26734d;padding:10px;background:#f3faf6;margin:10px 0}
.summary{background:#f7f9fa;border:1px solid #ddd;border-radius:10px;padding:12px;margin:14px 0}
.summary table{margin-top:8px}.actions{margin-top:16px}
@media print{body{background:#fff}.actions{display:none}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="card">
<h1>JeevSetu — Section 10<br>Yoga Readiness & Interest</h1>
<div id="app"></div>
</div>

<script>
"use strict";
const answers={};
let step=0,current=[],pos=0;

const sections=[
{id:"10.1",q:"क्या आपने पहले कभी योग किया है?",type:"yesno",yes:[
{id:"10.1a",q:"आप किस तरह का योग करते थे?",type:"text"},
{id:"10.1b",q:"कितने समय तक किया?",type:"text"},
{id:"10.1c",q:"अभी करते हैं या छोड़ दिया है?",type:"choice",options:["अभी करते हैं","छोड़ दिया है"]},
{id:"10.1d",q:"किस वजह से छोड़ा?",type:"text",onlyIf:"10.1c",onlyValue:"छोड़ दिया है"}
]},
{id:"10.2",q:"क्या आप अपने स्वास्थ्य के लिए योग सीखना चाहेंगे?",type:"yesno"},
{id:"10.3",q:"आप योग किस वजह से करना चाहेंगे?",type:"text",onlyIf:"10.2",onlyValue:"हाँ"},
{id:"10.4",q:"आप योग किस तरह सीखना पसंद करेंगे—किसी शिक्षक के साथ, समूह में या घर पर?",type:"choice",options:["किसी शिक्षक के साथ","समूह में","घर पर"]},
{id:"10.5",q:"योग करने में आपके लिए कोई परेशानी या रुकावट है?",type:"yesno",yes:[
{id:"10.5a",q:"कृपया बताइए।",type:"text"}
]},
{id:"10.6",q:"क्या कोई ऐसी परेशानी है जिसकी वजह से आपको जमीन पर बैठने, उठने, झुकने या हाथ-पैर चलाने में दिक्कत होती है?",type:"yesno",yes:[
{id:"10.6a",q:"कृपया बताइए कि किस काम में और कैसी दिक्कत होती है।",type:"text"}
]},
{id:"10.7",q:"क्या योग या किसी कसरत के दौरान कभी आपको दर्द, चक्कर, सांस फूलना या कोई दूसरी परेशानी हुई है?",type:"yesno",yes:[
{id:"10.7a",q:"कृपया बताइए कि क्या परेशानी हुई थी।",type:"text"}
]},
{id:"10.8",q:"मैंने योग के बारे में आपकी रुचि और आपकी सुविधा की जानकारी दर्ज की है। क्या यह सही है?",type:"confirm"}
];

const labels={
"10.1":"Previous yoga experience","10.1a":"Type of yoga previously practiced",
"10.1b":"Duration of previous yoga practice","10.1c":"Currently practicing or stopped",
"10.1d":"Reason for stopping yoga","10.2":"Interest in learning yoga",
"10.3":"Purpose for doing yoga","10.4":"Preferred way to learn yoga",
"10.5":"Barriers to yoga","10.5a":"Barrier details",
"10.6":"Physical limitations","10.6a":"Physical limitation details",
"10.7":"Problems during yoga/exercise","10.7a":"Problem details",
"10.8":"Patient confirmation"
};

function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function applicable(s){
  if(!s.onlyIf) return true;
  return answers[s.onlyIf]===s.onlyValue;
}

function render(){
  if(step>=sections.length){finalReport();return;}
  const s=sections[step];
  if(!applicable(s)){step++;render();return;}
  if(s.type==="confirm"){confirmStep();return;}

  let h='<div class="q"><b>'+esc(s.id)+'</b><br>'+esc(s.q)+'</div>';

  if(s.type==="yesno"){
    h+='<button class="btn" onclick="answer(&quot;हाँ&quot;)">हाँ</button>';
    h+='<button class="btn" onclick="answer(&quot;नहीं&quot;)">नहीं</button>';
  }else if(s.type==="choice"){
    s.options.forEach(o=>{
      h+='<button class="btn" data-value="'+esc(o)+'">'+esc(o)+'</button>';
    });
  }else{
    h+='<input id="txt" autocomplete="off">';
    h+='<br><button class="btn" onclick="textAnswer()">आगे</button>';
  }
  document.getElementById("app").innerHTML=h;

  document.querySelectorAll('#app .btn[data-value]').forEach(btn=>{
    btn.addEventListener('click',()=>answer(btn.getAttribute('data-value')));
  });
  const input=document.getElementById("txt"); if(input) input.focus();
}

function answer(v){
  const s=sections[step];
  answers[s.id]=v;
  if(v==="हाँ" && s.yes){
    current=s.yes.slice();
    pos=0;
    askSub();
    return;
  }
  next();
}

function askSub(){
  while(pos<current.length && !applicable(current[pos])) pos++;
  if(pos>=current.length){next();return;}

  const s=current[pos];
  let h='<div class="q"><b>'+esc(s.id)+'</b><br>'+esc(s.q)+'</div>';

  if(s.type==="yesno"){
    h+='<button class="btn" onclick="subAnswer(&quot;हाँ&quot;)">हाँ</button>';
    h+='<button class="btn" onclick="subAnswer(&quot;नहीं&quot;)">नहीं</button>';
  }else if(s.type==="choice"){
    s.options.forEach(o=>{
      h+='<button class="btn" data-subvalue="'+esc(o)+'">'+esc(o)+'</button>';
    });
  }else{
    h+='<input id="txt" autocomplete="off">';
    h+='<br><button class="btn" onclick="textSub()">आगे</button>';
  }
  document.getElementById("app").innerHTML=h;

  document.querySelectorAll('#app .btn[data-subvalue]').forEach(btn=>{
    btn.addEventListener('click',()=>subAnswer(btn.getAttribute('data-subvalue')));
  });
  const input=document.getElementById("txt"); if(input) input.focus();
}

function subAnswer(v){
  answers[current[pos].id]=v;
  pos++;
  askSub();
}

function textSub(){
  answers[current[pos].id]=document.getElementById("txt").value.trim();
  pos++;
  askSub();
}

function textAnswer(){
  answers[sections[step].id]=document.getElementById("txt").value.trim();
  next();
}

function next(){
  step++;current=[];pos=0;render();
}

function summaryHTML(){
  let rows="";
  Object.keys(labels).forEach(k=>{
    if(k!=="10.8" && answers[k]!==undefined)
      rows+='<tr><th>'+esc(labels[k])+'</th><td>'+esc(answers[k])+'</td></tr>';
  });
  return '<div class="summary"><b>दर्ज जानकारी:</b><table>'+rows+'</table></div>';
}

function confirmStep(){
  document.getElementById("app").innerHTML=
    '<div class="q"><b>10.8</b><br>'+
    'मैंने योग के बारे में आपकी रुचि और आपकी सुविधा की जानकारी दर्ज की है। क्या यह सही है?</div>'+
    summaryHTML()+
    '<button class="btn" onclick="confirmReport(&quot;हाँ&quot;)">हाँ</button>'+
    '<button class="btn" onclick="confirmReport(&quot;नहीं&quot;)">नहीं</button>';
}

function confirmReport(v){
  answers["10.8"]=v;
  if(v==="हाँ"){
    finalReport();
  }else{
    document.getElementById("app").innerHTML=
      '<div class="flag"><b>कृपया जानकारी की जाँच करें।</b><br>'+
      'आपने बताया कि दर्ज जानकारी सही नहीं है। Section 10 को फिर से शुरू करके सही जानकारी दर्ज करें।</div>'+
      '<button class="btn" onclick="location.reload()">Section 10 फिर से शुरू करें</button>';
  }
}

function finalReport(){
  let rows="";
  Object.keys(labels).forEach(k=>{
    if(answers[k]!==undefined)
      rows+='<tr><th>'+esc(labels[k])+'</th><td>'+esc(answers[k])+'</td></tr>';
  });

  let flags=[];
  if(answers["10.6"]==="हाँ")
    flags.push("Physical limitation reported; yoga selection and starting position should be individualized.");
  if(answers["10.7"]==="हाँ")
    flags.push("Pain, dizziness, breathlessness or another problem was reported during yoga/exercise; clinician or trained yoga professional should review before participation.");
  if(answers["10.5"]==="हाँ")
    flags.push("A barrier to yoga was reported; review the barrier before recommending a program.");

  const f=flags.length
    ? '<div class="flag"><b>Clinician / yoga-professional attention:</b><ul>'+flags.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>'
    : '<div class="ok">No specific attention flag was triggered by the answers recorded in this section.</div>';

  document.getElementById("app").innerHTML=
    '<div class="report"><h2>Clinician Report — Yoga Readiness & Interest</h2>'+
    '<div class="small">Section 10 | Patient-reported information | This section does not by itself establish a diagnosis or determine yoga suitability.</div>'+
    f+
    '<table><tr><th>Clinical item</th><th>Recorded response</th></tr>'+rows+'</table>'+
    '<p><b>Patient confirmation:</b> '+esc(answers["10.8"]||"Not recorded")+'</p>'+
    '<div class="actions">'+
    '<button class="btn" onclick="window.print()">Print / Save as PDF</button>'+
    '<button class="btn" onclick="location.reload()">Start Again</button>'+
    '</div></div>';
}

render();
</script>
</body>
</html>
