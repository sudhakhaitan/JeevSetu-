<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JeevSetu Section 12 — Alcohol History</title><style>body{font-family:Arial;max-width:820px;margin:auto;padding:18px;background:#f4f6f8}.card{background:white;padding:22px;border-radius:14px}.q{font-size:21px;margin:20px 0}.btn{font-size:18px;padding:11px 20px;margin:6px;border-radius:8px}input,textarea{font-size:18px;padding:10px;width:90%}textarea{min-height:90px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}.flag{padding:12px;background:#fff4f4;border-left:5px solid #b00020}.ok{padding:12px;background:#f3faf6;border-left:5px solid #26734d}.note{font-size:15px;color:#555}</style></head><body><div class="card"><h1>JeevSetu — Section 12<br>Alcohol History</h1><div id="app"></div></div><script>
const app=document.getElementById('app'); const A={};let i=0,sub=[],p=0;let path='';
const S=[
{id:'12.1',q:'क्या आप अभी शराब लेते हैं?',t:'yn',yes:[{id:'12.1a',q:'आप आमतौर पर किस तरह की शराब लेते हैं?',t:'text'},{id:'12.1b',q:'एक बार में लगभग कितनी शराब लेते हैं?',t:'text'},{id:'12.1c',q:'आप कितने दिन शराब लेते हैं—हर दिन, सप्ताह में कुछ दिन या कभी-कभी?',t:'text'},{id:'12.1d',q:'आप कितने वर्षों से शराब ले रहे हैं?',t:'text'}]},
{id:'12.2',q:'क्या आपने पहले कभी शराब ली है?',t:'yn',if:['12.1','नहीं'],yes:[{id:'12.2a',q:'आपने शराब कब बंद की?',t:'text'},{id:'12.2b',q:'जब आप शराब लेते थे, तो आमतौर पर किस तरह की शराब लेते थे?',t:'text'},{id:'12.2c',q:'उस समय एक बार में लगभग कितनी शराब लेते थे?',t:'text'},{id:'12.2d',q:'उस समय आप कितने दिन शराब लेते थे—हर दिन, सप्ताह में कुछ दिन या कभी-कभी?',t:'text'},{id:'12.2e',q:'आपने शराब कितने वर्षों तक ली?',t:'text'},{id:'12.2f',q:'आपने शराब क्यों बंद की?',t:'text'}]},
{id:'12.3',q:'क्या कभी ऐसा होता है कि आप जिस दिन शराब लेते हैं, उस दिन अपनी सामान्य मात्रा से बहुत ज्यादा शराब पी लेते हैं?',t:'yn',if:['12.1','हाँ'],yes:[{id:'12.3a',q:'ऐसा लगभग कितनी बार होता है?',t:'text'}]},
{id:'12.3P',q:'जब आप शराब लेते थे, क्या कभी ऐसा होता था कि किसी दिन आप अपनी सामान्य मात्रा से बहुत ज्यादा शराब पी लेते थे?',t:'yn',if:['12.1','नहीं'],past:true,yes:[{id:'12.3aP',q:'ऐसा लगभग कितनी बार होता था?',t:'text'}]},
{id:'12.4',q:'जिस दिन आप शराब लेते हैं और सामान्य से ज्यादा शराब लेते हैं, क्या उस दिन या उसके बाद आपकी कोई परेशानी बढ़ जाती है?',t:'yn',if:['12.1','हाँ'],yes:[{id:'12.4a',q:'कौन-सी परेशानी बढ़ती है?',t:'text'},{id:'12.4b',q:'शराब लेने के कितनी देर बाद या अगले दिन बढ़ती है?',t:'text'}]},
{id:'12.4P',q:'जब आप शराब लेते थे और सामान्य से ज्यादा शराब लेते थे, क्या उस दिन या उसके बाद आपकी कोई परेशानी बढ़ जाती थी?',t:'yn',if:['12.1','नहीं'],past:true,yes:[{id:'12.4aP',q:'कौन-सी परेशानी बढ़ती थी?',t:'text'},{id:'12.4bP',q:'शराब लेने के कितनी देर बाद या अगले दिन बढ़ती थी?',t:'text'}]},
{id:'12.5',q:'क्या आपने कभी शराब कम करने या पूरी तरह बंद करने की कोशिश की है?',t:'yn',if:['12.1','हाँ'],yes:[{id:'12.5a',q:'क्या आप सफल रहे?',t:'yn'},{id:'12.5b',q:'अगर फिर दोबारा शुरू हुई, तो क्या वजह रही?',t:'text'}]},
{id:'12.6',q:'आपने पहली बार शराब पीना क्यों शुरू किया था?',t:'text',if:['12.1','हाँ']},
{id:'12.6P',q:'आपने पहली बार शराब पीना क्यों शुरू किया था?',t:'text',if:['12.1','नहीं'],past:true},
{id:'12.7',q:'क्या दोस्तों, काम की जगह, तनाव, किसी की देखा-देखी या किसी और वजह से आप शराब पीना शुरू करते हैं?',t:'text',if:['12.1','हाँ']},
{id:'12.7P',q:'क्या दोस्तों, काम की जगह, तनाव, किसी की देखा-देखी या किसी और वजह से आपने शराब पीना शुरू किया था?',t:'text',if:['12.1','नहीं'],past:true},
{id:'12.8',q:'क्या आप कभी अपनी दवा लेने के समय शराब भी लेते हैं?',t:'yn',if:['12.1','हाँ']},
{id:'12.9',q:'जब आप शराब लेते हैं, तो उसके बाद आपकी कोई और परेशानी या बदलाव महसूस होता है?',t:'yn',if:['12.1','हाँ'],yes:[{id:'12.9a',q:'कृपया बताइए।',t:'text'}]},
{id:'12.10',q:'जब आपने शराब कम की या बंद की, तो इनमें से कौन-कौन सी परेशानी हुई थी?',t:'multi',o:['हाथ कांपना','बहुत पसीना आना','घबराहट','नींद न आना','बेचैनी','कोई दूसरी परेशानी नहीं','कोई और परेशानी'],if:['12.1','हाँ']},
{id:'12.10P',q:'जब आपने शराब बंद की, तो इनमें से कौन-कौन सी परेशानी हुई थी?',t:'multi',o:['हाथ कांपना','बहुत पसीना आना','घबराहट','नींद न आना','बेचैनी','कोई दूसरी परेशानी नहीं','कोई और परेशानी'],if:['12.1','नहीं'],past:true},
{id:'12.11',q:'क्या withdrawal के दौरान कोई और परेशानी हुई थी?',t:'text',if:['12.10','__OTHER__']},
{id:'12.11P',q:'शराब बंद करने के दौरान कोई और परेशानी हुई थी?',t:'text',if:['12.10P','__OTHER__'],past:true},
{id:'12.12',q:'मैंने आपकी शराब से जुड़ी जानकारी दर्ज की है। क्या इसमें कोई गलती है?',t:'confirm'}];
const L={'12.1':'Current alcohol use','12.1a':'Current alcohol type','12.1b':'Current quantity per occasion','12.1c':'Current frequency','12.1d':'Current duration','12.2':'Past alcohol use','12.2a':'Stopped alcohol when','12.2b':'Past alcohol type','12.2c':'Past quantity per occasion','12.2d':'Past frequency','12.2e':'Past duration','12.2f':'Reason for stopping','12.3':'More-than-usual drinking (current)','12.3a':'Frequency of more-than-usual drinking (current)','12.3P':'More-than-usual drinking (past)','12.3aP':'Frequency of more-than-usual drinking (past)','12.4':'Effect on symptoms (current)','12.4a':'Problem worsened (current)','12.4b':'Timing of worsening (current)','12.4P':'Effect on symptoms (past)','12.4aP':'Problem worsened (past)','12.4bP':'Timing of worsening (past)','12.5':'Attempts to stop/reduce (current)','12.5a':'Successful attempt','12.5b':'Reason for restarting','12.6':'Reason for starting (current history)','12.6P':'Reason for starting (past history)','12.7':'Possible reasons/context for starting (current history)','12.7P':'Possible reasons/context for starting (past history)','12.8':'Alcohol with medicine (current)','12.9':'Other effects/problems (current)','12.9a':'Other effects details (current)','12.10':'Withdrawal symptoms (current history)','12.10P':'Withdrawal symptoms (past history)','12.11':'Other withdrawal details','12.11P':'Other withdrawal details (past)','12.12':'Patient confirmation'};
const e=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function ok(s){
if(s.id==='12.5'&&A['12.1']!=='हाँ')return false;
if(!s.if)return true;
let v=A[s.if[0]];
if(s.if[1]==='__OTHER__')return Array.isArray(v)&&v.includes('कोई और परेशानी');
if(s.past)return A['12.1']==='नहीं'&&A['12.2']==='हाँ';
return v===s.if[1];
}
function render(){while(i<S.length&&!ok(S[i]))i++;if(i>=S.length)return report();let s=S[i];if(s.t==='confirm')return confirm();let h='<div class="q"><b>'+s.id+'</b><br>'+e(s.q)+'</div>';if(s.t==='yn')h+='<button class=\"btn\" onclick=\"ans(\'हाँ\')\">हाँ</button><button class=\"btn\" onclick=\"ans(\'नहीं\')\">नहीं</button>';else if(s.t==='multi'){h+='<div>';s.o.forEach(x=>h+='<label style="display:block;margin:10px 0;font-size:18px"><input type="checkbox" name="multi" value="'+e(x)+'" style="width:auto;margin-right:10px">'+e(x)+'</label>');h+='</div><button class="btn" onclick="multiAns()">आगे</button><div class="note">एक से अधिक विकल्प चुन सकते हैं।</div>'}else h+='<textarea id="x"></textarea><br><button class="btn" onclick="txt()">आगे</button>';app.innerHTML=h;let x=document.getElementById('x');if(x)x.focus()}
function multiAns(){let s=S[i],v=[...document.querySelectorAll('input[name="multi"]:checked')].map(x=>x.value);if(!v.length){alert('कृपया कम से कम एक विकल्प चुनें।');return}A[s.id]=v;next()}
function ans(v){let s=S[i];A[s.id]=v;if(s.id==='12.2'&&v==='नहीं'&&A['12.1']==='नहीं'){return noAlcoholComplete()}if(v==='हाँ'&&s.yes){sub=s.yes;p=0;ask()}else next()}
function noAlcoholComplete(){A['12.12']='हाँ';report();}
function ask(){while(p<sub.length&&!ok(sub[p]))p++;if(p>=sub.length)return next();let s=sub[p],h='<div class="q"><b>'+s.id+'</b><br>'+e(s.q)+'</div>';if(s.t==='yn')h+='<button class=\"btn\" onclick=\"sa(\'हाँ\')\">हाँ</button><button class=\"btn\" onclick=\"sa(\'नहीं\')\">नहीं</button>';else h+='<textarea id="x"></textarea><br><button class="btn" onclick="st()">आगे</button>';app.innerHTML=h;let x=document.getElementById('x');if(x)x.focus()}
function sa(v){A[sub[p].id]=v;p++;ask()}function st(){A[sub[p].id]=document.getElementById('x').value.trim();p++;ask()}function txt(){A[S[i].id]=document.getElementById('x').value.trim();next()}function next(){i++;sub=[];p=0;render()}
function summary(){let r='';Object.keys(L).forEach(k=>{if(k!=='12.12'&&A[k]!==undefined)r+='<tr><th>'+e(L[k])+'</th><td>'+e(Array.isArray(A[k])?A[k].join('、'):A[k])+'</td></tr>'});return '<table>'+r+'</table>'}
function confirm(){app.innerHTML='<div class="q"><b>12.12</b><br>'+e(S[S.length-1].q)+'</div>'+summary()+'<button class="btn" onclick="cr(\'हाँ\')">हाँ — Clinical Note बनाएं</button><button class="btn" onclick="cr(\'नहीं\')">नहीं</button><br><button class="btn" onclick="A[\'12.12\']=\'हाँ\';report()">Generate Clinical Note</button>'}
function cr(v){A['12.12']=v;if(v==='हाँ')report();else app.innerHTML='<div class="flag"><b>कृपया जानकारी की जाँच करें।</b><br>Section 12 को फिर से शुरू करके सही जानकारी दर्ज करें।</div><button class="btn" onclick="location.reload()">Section 12 फिर से शुरू करें</button>'}
function report(){let r='';Object.keys(L).forEach(k=>{if(A[k]!==undefined)r+='<tr><th>'+e(L[k])+'</th><td>'+e(Array.isArray(A[k])?A[k].join('、'):A[k])+'</td></tr>'});let w=(Array.isArray(A['12.10'])?A['12.10']:[]).concat(Array.isArray(A['12.10P'])?A['12.10P']:[]);let alertNeeded=w.some(x=>['हाथ कांपना','बहुत पसीना आना','घबराहट','नींद न आना','बेचैनी','कोई और परेशानी'].includes(x));let never=(A['12.1']==='नहीं'&&A['12.2']==='नहीं');let title=never?'Clinician Report — Alcohol History (No Alcohol Use)':'Clinician Report — Alcohol History';let status=never?'<div class="ok"><b>No current or past alcohol use reported.</b><br>Section 12 completed without further alcohol-history questions.</div>':(alertNeeded?'<div class="flag"><b>CLINICIAN ALERT: Possible alcohol withdrawal symptoms reported.</b><br>Review the reported withdrawal symptoms clinically.</div>':'<div class="ok"><b>Alcohol history recorded.</b></div>');app.innerHTML='<h2>'+title+'</h2>'+status+'<table>'+r+'</table><p><b>Patient confirmation:</b> '+e(A['12.12']||'Not recorded')+'</p><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn" onclick="location.reload()">Start Again</button>'}render();</script></div></body></html>
