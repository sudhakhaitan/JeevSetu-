<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JeevSetu — Section 17</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:auto;padding:18px;background:#f7f7f7;color:#222}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0001}
h1{font-size:22px} h2{font-size:18px;margin-top:8px}.q{font-size:20px;line-height:1.55;margin:20px 0}
button{padding:12px 18px;margin:5px;border:0;border-radius:9px;background:#2457a6;color:white;font-size:16px}
button.secondary{background:#777}.hidden{display:none}
input,textarea,select{width:100%;box-sizing:border-box;padding:12px;font-size:17px;margin:8px 0;border:1px solid #bbb;border-radius:8px}
.flag{background:#ffe0e0;border:2px solid #c33;padding:14px;border-radius:10px}
table,th,td{border:1px solid #ddd} th,td{padding:8px;vertical-align:top}.note{white-space:pre-wrap;background:#fafafa;padding:14px;border-radius:8px;border:1px solid #ddd}
.small{font-size:14px;color:#555}
</style>
</head>
<body>
<div class="card">
<h1>SECTION 17 — REPRODUCTIVE, SEXUAL, OBSTETRIC & FERTILITY HISTORY</h1>
<div id="app"></div>
</div>
<script>
const A=[];
let i=0, sex="", age=null;
const app=document.getElementById("app");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(q,buttons=[],input=false,type="text"){
  app.innerHTML=`<div class="q">${q}</div>`+
  (input?`<input id="ans" type="${type}" inputmode="${type==="number"?"numeric":"text"}" autofocus><button onclick="saveInput()">आगे बढ़ें</button>`:"")+
  buttons.map((b,n)=>`<button onclick="answer(${n})">${esc(b)}</button>`).join("");
  window._buttons=buttons;
}
function answer(n){
 const v=window._buttons[n];
 A.push({q:window._q,a:v});
 if(window._q==="रोगी का लिंग") sex=v;
 next();
}
function saveInput(){
 const x=document.getElementById("ans");
 if(!x||!x.value.trim()){alert("कृपया उत्तर दर्ज करें।");return;}
 const v=x.value.trim(); A.push({q:window._q,a:v});
 if(window._q==="रोगी की उम्र") age=parseInt(v,10);
 next();
}
function ask(q,buttons=[],input=false,type="text"){window._q=q;render(q,buttons,input,type);
 if(input)setTimeout(()=>{const x=document.getElementById("ans");if(x)x.addEventListener("keydown",e=>{if(e.key==="Enter")saveInput();});},0);}
function next(){
 i++;
 if(i===1)return ask("अब मैं स्वास्थ्य से जुड़ी कुछ निजी जानकारी के बारे में पूछूंगा। ये प्रश्न आपकी चिकित्सा देखभाल के लिए हैं। अगर किसी प्रश्न का उत्तर आप नहीं देना चाहते हैं, तो आप ऐसा बता सकते हैं।",["सहमत — आगे बढ़ें","नहीं देना चाहता/चाहती"]);
 if(i===2)return ask("रोगी का लिंग",["महिला","पुरुष","अन्य / बताना नहीं"]);
 if(i===3)return ask("रोगी की उम्र",[],true,"number");

 /* FEMALE — MENSTRUAL / MENOPAUSE */
 if(i===4 && sex==="महिला")return ask("क्या आपकी माहवारी अभी आती है?",["हाँ","नहीं","लागू नहीं"]);
 if(i===5 && sex==="महिला"){
   const last=A[A.length-1]?.a;
   if(last==="हाँ")return ask("आपकी आखिरी माहवारी कब शुरू हुई थी?",["तारीख नहीं मालूम"],true);
   return ask("क्या आपकी माहवारी पूरी तरह बंद हो चुकी है?",["हाँ","नहीं","लागू नहीं"]);
 }
 if(i===6 && sex==="महिला"){
   const vals=A.map(x=>x.a);
   if(vals.includes("हाँ") && A.some(x=>x.q==="क्या आपकी माहवारी अभी आती है?"&&x.a==="हाँ"))return ask("आमतौर पर कितने दिनों के अंतर पर आती है?",[],true,"number");
   return ask("लगभग किस उम्र में माहवारी बंद हुई?",[],true,"number");
 }
 if(i===7 && sex==="महिला"){
   const menstruating=A.some(x=>x.q==="क्या आपकी माहवारी अभी आती है?"&&x.a==="हाँ");
   if(menstruating)return ask("माहवारी कितने दिनों तक रहती है?",[],true,"number");
   return ask("माहवारी बंद होने के बाद क्या अचानक गर्मी लगना, बहुत पसीना आना, नींद में परेशानी या दूसरी परेशानी हुई?",["हाँ","नहीं"]);
 }
 if(i===8 && sex==="महिला"){
   const menstruating=A.some(x=>x.q==="क्या आपकी माहवारी अभी आती है?"&&x.a==="हाँ");
   if(menstruating)return ask("Bleeding सामान्य रहती है या बहुत ज्यादा होती है?",["सामान्य","बहुत ज्यादा","अनिश्चित"]);
   return ask("क्या माहवारी बंद होने के बाद कोई ऐसी परेशानी अभी भी है जिसके बारे में डॉक्टर को बताना चाहें?",["हाँ","नहीं"]);
 }
 if(i===9 && sex==="महिला"){
   const menstruating=A.some(x=>x.q==="क्या आपकी माहवारी अभी आती है?"&&x.a==="हाँ");
   if(menstruating)return ask("क्या माहवारी के समय बहुत ज्यादा दर्द होता है?",["हाँ","नहीं"]);
   return pregnancyStart();
 }
 if(i===10 && sex==="महिला"){
   const menstruating=A.some(x=>x.q==="क्या आपकी माहवारी अभी आती है?"&&x.a==="हाँ");
   if(menstruating)return pregnancyStart();
   return pregnancyStart();
 }

 /* MALE — REPRODUCTIVE / SEXUAL / URINARY */
 if(i===4 && sex==="पुरुष")return ask("क्या आपको यौन संबंध, erection, ejaculation, sexual desire या जननांग से जुड़ी कोई परेशानी है?",["हाँ","नहीं","बताना नहीं"]);
 if(i===5 && sex==="पुरुष"){
   const a=A[A.length-1]?.a;
   if(a==="हाँ")return ask("कृपया बताएं: erection में परेशानी, इच्छा कम होना, ejaculation की समस्या, दर्द, discharge/infection या कोई दूसरी परेशानी",[],true);
   return ask("क्या आपको पेशाब से जुड़ी कोई ऐसी परेशानी है जिसके बारे में डॉक्टर को बताना चाहेंगे?",["हाँ","नहीं"]);
 }
 if(i===6 && sex==="पुरुष"){
   const last=A[A.length-1]?.a;
   if(last==="हाँ" && A[A.length-1]?.q.includes("पेशाब"))return ask("कृपया पेशाब की परेशानी के बारे में बताएं",[],true);
   return maleFertilityStart();
 }
 if(i===7 && sex==="पुरुष")return maleFertilityStart();

 /* OTHER / UNKNOWN SEX */
 if(i===4 && sex!=="महिला" && sex!=="पुरुष")return ask("क्या reproductive, sexual या fertility से जुड़ी कोई परेशानी है जिसके बारे में आप डॉक्टर को बताना चाहेंगे?",["हाँ","नहीं","बताना नहीं"]);
 if(i===5 && sex!=="महिला" && sex!=="पुरुष"){
   if(A[A.length-1]?.a==="हाँ")return ask("कृपया अपनी परेशानी के बारे में बताएं",[],true);
   return confirm();
 }
 return confirm();
}
function pregnancyStart(){
 return ask("क्या आपको कभी pregnancy हुई है?",["हाँ","नहीं","लागू नहीं"]);
}
function maleFertilityStart(){
 return ask("क्या कभी pregnancy होने में परेशानी रही है, या आपने fertility के लिए जांच या treatment कराया है?",["हाँ","नहीं","लागू नहीं"]);
}
function pregnancyFlow(){
 const q=A[A.length-1]?.q, a=A[A.length-1]?.a;
 if(q==="क्या आपको कभी pregnancy हुई है?"&&a==="नहीं")return ask("क्या अभी pregnancy होने की संभावना है?",["हाँ","नहीं","पता नहीं / अनिश्चित"]);
 if(q==="क्या आपको कभी pregnancy हुई है?"&&a==="लागू नहीं")return confirm();
 if(q==="क्या आपको कभी pregnancy हुई है?"&&a==="हाँ")return ask("कुल कितनी pregnancies हुई थीं?",[],true,"number");
 if(q==="क्या अभी pregnancy होने की संभावना है?")return ask("क्या आप अभी बच्चे को अपना दूध पिला रही हैं?",["हाँ","नहीं","लागू नहीं"]);
 if(q==="कुल कितनी pregnancies हुई थीं?")return pregnancyTable();
 if(q==="Pregnancy history — outcome table")return ask("क्या किसी pregnancy में कोई बड़ी complication हुई थी?",["हाँ","नहीं","लागू नहीं"]);
 if(q==="क्या किसी pregnancy में कोई बड़ी complication हुई थी?"&&a==="हाँ")return ask("किस pregnancy में complication हुई थी और क्या treatment दिया गया था?",[],true);
 if(q==="क्या किसी pregnancy में कोई बड़ी complication हुई थी?"&&a!=="हाँ")return pregnancyEndQuestions();
 if(q==="किस pregnancy में complication हुई थी और क्या treatment दिया गया था?")return pregnancyEndQuestions();
 if(q==="क्या अभी बच्चे को अपना दूध पिला रही हैं?")return ask("क्या आपकी वर्तमान स्वास्थ्य समस्या से जुड़ी कोई यौन या वैवाहिक परेशानी है जिसके बारे में आप डॉक्टर को बताना चाहें?",["हाँ","नहीं","बताना नहीं","लागू नहीं"]);
 if(q==="क्या आपकी वर्तमान स्वास्थ्य समस्या से जुड़ी कोई यौन या वैवाहिक परेशानी है जिसके बारे में आप डॉक्टर को बताना चाहें?"&&a==="हाँ")return ask("कृपया उस परेशानी के बारे में बताएं",[],true);
 return confirm();
}
function pregnancyEndQuestions(){
 return ask("क्या आपकी वर्तमान स्वास्थ्य समस्या से जुड़ी कोई यौन या वैवाहिक परेशानी है जिसके बारे में आप डॉक्टर को बताना चाहें?",["हाँ","नहीं","बताना नहीं","लागू नहीं"]);
}
function pregnancyTable(){
 const n=Math.max(1,Math.min(20,parseInt(A.find(x=>x.q==="कुल कितनी pregnancies हुई थीं?")?.a||"0",10)));
 let rows="";
 for(let k=1;k<=n;k++)rows+=`<tr><td>${k}</td><td><input id="py${k}" type="number" placeholder="वर्ष"></td><td><select id="po${k}"><option value="">चुनें</option><option>Normal delivery</option><option>Caesarean (CS)</option><option>Miscarriage</option><option>Stillbirth</option><option>Termination / abortion</option><option>Ectopic pregnancy</option><option>Pregnancy ongoing</option><option>Other / not sure</option></select></td><td><input id="pd${k}" type="text" placeholder="जरूरी अतिरिक्त जानकारी"></td></tr>`;
 app.innerHTML=`<div class="q"><b>हर pregnancy के बारे में जानकारी दें</b><br><span class="small">हर पंक्ति में वर्ष और pregnancy का outcome चुनें। इससे अलग-अलग outcome के लिए बार-बार सवाल नहीं पूछे जाएंगे।</span></div><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:15px"><thead><tr><th>#</th><th>वर्ष</th><th>Pregnancy outcome</th><th>अतिरिक्त जानकारी</th></tr></thead><tbody>${rows}</tbody></table></div><button onclick="savePregnancies()">आगे बढ़ें</button>`;
}
function savePregnancies(){
 const n=Math.max(1,Math.min(20,parseInt(A.find(x=>x.q==="कुल कितनी pregnancies हुई थीं?")?.a||"0",10)));
 const data=[];
 for(let k=1;k<=n;k++){const year=document.getElementById("py"+k)?.value.trim()||"",outcome=document.getElementById("po"+k)?.value||"",detail=document.getElementById("pd"+k)?.value.trim()||"";
  if(!outcome){alert(`Pregnancy ${k} का outcome चुनें।`);return;} data.push(`${year||"वर्ष अज्ञात"} — ${outcome}${detail?" — "+detail:""}`);}
 A.push({q:"Pregnancy history — outcome table",a:data.join(" | ")});
 pregnancyFlow();
}
function confirm(){
 app.innerHTML='<div class="q">क्या reproductive, sexual, pregnancy या fertility history के बारे में कोई और महत्वपूर्ण जानकारी है जो अभी दर्ज नहीं हुई?</div><textarea id="extra" rows="5" placeholder="रोगी अपनी भाषा में बता सकता/सकती है..."></textarea><button onclick="saveExtra()">जानकारी सुरक्षित करें</button><button class="secondary" onclick="saveExtra(true)">कोई अतिरिक्त जानकारी नहीं</button>';
}
function saveExtra(skip=false){
 const x=document.getElementById("extra"),v=skip?"कोई अतिरिक्त जानकारी नहीं":(x?.value.trim()||"");
 if(!skip&&!v){alert("कृपया जानकारी लिखें या “कोई अतिरिक्त जानकारी नहीं” चुनें।");return;}
 A.push({q:"अतिरिक्त जानकारी",a:v});finish();
}
function finish(){
 let note="SECTION 17 — REPRODUCTIVE, SEXUAL, OBSTETRIC & FERTILITY HISTORY\n\n"+A.map(x=>x.q+" — "+x.a).join("\n");
 const current=A.find(x=>x.q==="क्या अभी pregnancy होने की संभावना है?");
 const flag=current&&(current.a==="हाँ"||current.a==="पता नहीं / अनिश्चित");
 app.innerHTML="<h2>Clinical Note Preview</h2>"+(flag?'<div class="flag"><b>CLINICIAN FLAG:</b> Current pregnancy possible/uncertain — clinician review required.</div>':"")+
 '<div class="note">'+esc(note)+"</div><button onclick=\"copyNote()\">Copy Clinical Note</button>";
 window.note=note;
}
function copyNote(){navigator.clipboard?.writeText(window.note);alert("Clinical note copied.");}

/* Route by branch after every answer */
const originalNext=next;
next=function(){
 if(i>=4){
   const lastq=A[A.length-1]?.q;
   if(sex==="महिला" && (lastq==="क्या आपको कभी pregnancy हुई है?"||lastq==="क्या अभी pregnancy होने की संभावना है?"||lastq==="कुल कितनी pregnancies हुई थीं?"||lastq==="Pregnancy history — outcome table"||lastq==="क्या किसी pregnancy में कोई बड़ी complication हुई थी?"||lastq==="किस pregnancy में complication हुई थी और क्या treatment दिया गया?"||lastq==="क्या आप अभी बच्चे को अपना दूध पिला रही हैं?"||lastq==="क्या आपकी वर्तमान स्वास्थ्य समस्या से जुड़ी कोई यौन या वैवाहिक परेशानी है जिसके बारे में आप डॉक्टर को बताना चाहें?"||lastq==="कृपया उस परेशानी के बारे में बताएं")) return pregnancyFlow();
 }
 return originalNext();
};
next();
</script>
</body>
</html>
