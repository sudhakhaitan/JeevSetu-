<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JeevSetu Section 16 — Stress, Emotional & Psychological History</title><style>body{font-family:Arial;max-width:820px;margin:auto;padding:18px;background:#f4f6f8}.card{background:white;padding:22px;border-radius:14px}.q{font-size:21px;margin:20px 0}.btn{font-size:18px;padding:11px 20px;margin:6px;border-radius:8px}input,textarea{font-size:18px;padding:10px;width:90%;box-sizing:border-box}textarea{min-height:100px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}.flag{padding:12px;background:#fff4f4;border-left:5px solid #b00020}.ok{padding:12px;background:#f3faf6;border-left:5px solid #26734d} .private{padding:14px;background:#f7f3ff;border-left:5px solid #6b3fa0;margin:15px 0}.small{font-size:16px;color:#555}</style></head><body><div class="card"><h1>JeevSetu — Section 16<br>Stress, Emotional & Psychological History</h1><div id="app"></div></div><script>
const app=document.getElementById('app');const A={};let i=0;
const S=[
{id:'16.1',q:'क्या इन दिनों आपके जीवन में कोई ऐसी बात है जिसकी वजह से आपको ज्यादा चिंता, तनाव या परेशानी रहती है?',t:'text'},
{id:'16.2',q:'यह परेशानी कब से चल रही है?',t:'text'},
{id:'16.2a',q:'क्या यह परेशानी लगातार रहती है या कभी-कभी ज्यादा हो जाती है?',t:'text'},
{id:'16.3',q:'इस तनाव या चिंता की वजह से आपके रोज़ के काम, नींद या खाने पर कोई असर पड़ा है?',t:'yn'},
{id:'16.3a',q:'किस तरह का असर पड़ा है?',t:'text',if:['16.3','हाँ']},
{id:'16.4',q:'पिछले कुछ समय से आपका मन कैसा रहता है?',t:'text'},
{id:'16.4a',q:'क्या आपको पहले जिन चीज़ों में खुशी मिलती थी, उनमें अब भी उतनी ही रुचि रहती है?',t:'yn',if:['16.4','low']},
{id:'16.5',q:'क्या आपको बार-बार ऐसी चिंता या घबराहट होती है जिसे रोकना मुश्किल लगता है?',t:'yn'},
{id:'16.5a',q:'क्या इससे आपकी नींद, काम या रोज़मर्रा की जिंदगी प्रभावित होती है?',t:'yn',if:['16.5','हाँ']},
{id:'16.6',q:'तनाव या चिंता के समय क्या आपका दिल तेज धड़कता है, पसीना आता है, हाथ कांपते हैं, सांस तेज चलती है या पेट में परेशानी होती है?',t:'text'},
{id:'16.7',q:'जब आपको कोई परेशानी होती है, तो क्या आपके पास ऐसा कोई व्यक्ति है जिससे आप खुलकर बात कर सकें?',t:'yn'},
{id:'16.8',q:'क्या आपको अक्सर ऐसा लगता है कि आप अकेले हैं या आपके पास बात करने वाला कोई नहीं है?',t:'yn'},
{id:'16.9',q:'क्या किसी बीमार या जरूरतमंद व्यक्ति की देखभाल की जिम्मेदारी की वजह से आपको बहुत तनाव रहता है?',t:'yn'},
{id:'16.10',q:'मैं आपसे मन और भावनाओं से जुड़े कुछ और निजी प्रश्न पूछना चाहता/चाहती हूँ। क्या आप इस निजी जाँच का उत्तर देना चाहेंगे?',t:'yn'},

{id:'16.11',q:'जब आपको तनाव होता है तो आपको किस चीज़ से सबसे ज्यादा राहत मिलती है?',t:'text'},
{id:'16.12',q:'अगर डॉक्टर को लगे कि इससे आपको फायदा हो सकता है, तो क्या आप किसी counsellor या mental-health professional से बात करना चाहेंगे?',t:'choice',opts:['हाँ','नहीं','पता नहीं']},
];

let screeningStage=null,screeningIndex=0;
const SCALE=[["बिल्कुल नहीं",0],["कई दिनों में",1],["आधे से अधिक दिनों में",2],["लगभग हर दिन",3]];
const PHQ9=[
"पिछले 2 हफ्तों में, आपको पहले जिन कामों में रुचि या खुशी मिलती थी, उनमें रुचि या खुशी कम हुई?",
"पिछले 2 हफ्तों में, आपको उदासी, निराशा या मायूसी महसूस हुई?",
"पिछले 2 हफ्तों में, आपको नींद आने में परेशानी, रात में बार-बार नींद खुलना या बहुत ज्यादा सोना हुआ?",
"पिछले 2 हफ्तों में, आपको थकान या ऊर्जा की कमी महसूस हुई?",
"पिछले 2 हफ्तों में, आपकी भूख कम या ज्यादा हुई?",
"पिछले 2 हफ्तों में, आपको अपने बारे में बुरा लगा — जैसे आपको लगा हो कि आप असफल हैं या आपने खुद को या अपने परिवार को निराश किया है?",
"पिछले 2 हफ्तों में, किसी चीज़ पर ध्यान लगाने में परेशानी हुई — जैसे अखबार पढ़ने या टीवी देखने में?",
"पिछले 2 हफ्तों में, आपकी चाल-ढाल या बोलने की गति इतनी धीमी हो गई कि दूसरे लोगों ने ध्यान दिया? या इसके उलट, आप इतने बेचैन हुए कि सामान्य से ज्यादा घूमते-फिरते रहे?",
"पिछले 2 हफ्तों में, क्या आपको लगा कि आपके लिए बेहतर होता अगर आप मर जाते, या आपने किसी तरह खुद को नुकसान पहुँचाने के बारे में सोचा?"
];
const GAD7=[
"पिछले 2 हफ्तों में, आपको घबराहट, चिंता या तनाव कितनी बार रहा?",
"पिछले 2 हफ्तों में, आपको अपनी चिंता को रोकना या उस पर काबू पाना कितनी बार मुश्किल लगा?",
"पिछले 2 हफ्तों में, आपको अलग-अलग बातों को लेकर बहुत ज्यादा चिंता कितनी बार हुई?",
"पिछले 2 हफ्तों में, आपको आराम करने में कितनी बार परेशानी हुई?",
"पिछले 2 हफ्तों में, आपको इतनी बेचैनी हुई कि चुपचाप बैठना मुश्किल लगा?",
"पिछले 2 हफ्तों में, आपको आसानी से चिढ़ या गुस्सा कितनी बार आया?",
"पिछले 2 हफ्तों में, आपको ऐसा लगा कि जैसे कोई बुरी बात होने वाली है, कितनी बार हुआ?"
];
function screeningQuestion(){
 const list=screeningStage==='PHQ-9'?PHQ9:GAD7;
 app.innerHTML='<div class="private"><b>'+screeningStage+' — निजी जाँच</b><br>कृपया पिछले 2 हफ्तों को ध्यान में रखकर उत्तर दें। यह प्रश्नावली स्वयं भरने के लिए है। इतिहास लेने वाला व्यक्ति आपके व्यक्तिगत उत्तर न देखे।</div><div class="small">प्रश्न '+(screeningIndex+1)+' / '+list.length+'</div><div class="q">'+esc(list[screeningIndex])+'</div>'+SCALE.map(o=>'<button class="btn" onclick="screenAns('+o[1]+')">'+o[0]+'</button>').join('');
}
function screenAns(v){
 const key=screeningStage==='PHQ-9'?'PHQ9':'GAD7';
 A[key]=A[key]||[]; A[key][screeningIndex]=v; screeningIndex++;
 const list=screeningStage==='PHQ-9'?PHQ9:GAD7;
 if(screeningIndex<list.length){screeningQuestion();return;}
 if(screeningStage==='PHQ-9'){screeningStage='GAD-7';screeningIndex=0;screeningQuestion();return;}
 renderScreeningImpact();
}
function startScreening(){A['16.10']='हाँ';screeningStage='PHQ-9';screeningIndex=0;screeningQuestion();}
function renderScreeningImpact(){
 app.innerHTML='<h2>दैनिक जीवन पर असर</h2><div class="q">इन परेशानियों की वजह से आपके रोज़मर्रा के काम, घर के काम या लोगों से मिलने-जुलने में कितनी परेशानी होती है?</div>'+["बिल्कुल कोई परेशानी नहीं","थोड़ी परेशानी","काफी परेशानी","बहुत ज्यादा परेशानी"].map((x,i)=>'<button class="btn" onclick="A.screenImpact='+i+';screeningStage=null;next();">'+x+'</button>').join('');
}
function screeningScore(a){return (a||[]).reduce((s,x)=>s+Number(x||0),0)}
function phqSeverity(s){return s<=4?'न्यूनतम':s<=9?'हल्का':s<=14?'मध्यम':s<=19?'मध्यम से गंभीर':'गंभीर'}
function gadSeverity(s){return s<=4?'न्यूनतम':s<=9?'हल्का':s<=14?'मध्यम':'गंभीर'}

const L={};S.forEach(s=>L[s.id]=s.q);
function ok(s){if(!s.if)return true;return A[s.if[0]]===s.if[1]}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){while(i<S.length&&!ok(S[i]))i++;if(i>=S.length)return report();let s=S[i];let h='<div class="q"><b>'+s.id+'</b><br>'+esc(s.q)+'</div>';if(s.t==='yn')h+='<button class="btn" onclick="ans(\'हाँ\')">हाँ</button><button class="btn" onclick="ans(\'नहीं\')">नहीं</button>';else if(s.t==='choice')h+=s.opts.map(o=>'<button class="btn" onclick="ans(\''+o+'\')">'+o+'</button>').join('');else h+='<textarea id="x"></textarea><br><button class="btn" onclick="txt()">आगे</button>';app.innerHTML=h;let x=document.getElementById('x');if(x)x.focus()}
function ans(v){A[S[i].id]=v;if(S[i].id==='16.10'&&v==='हाँ'){startScreening();return;}next()}function txt(){A[S[i].id]=document.getElementById('x').value.trim();next()}function next(){i++;render()}
function summary(){let r='';Object.keys(A).forEach(k=>{r+='<tr><th>'+esc(L[k]||k)+'</th><td>'+esc(A[k])+'</td></tr>'});return '<table>'+r+'</table>'}
function report(){
 let safety='<div class="ok"><b>Section 16 recorded.</b></div>',screening='';
 if(A['16.10']==='हाँ'&&A.PHQ9&&A.GAD7){
  const ps=screeningScore(A.PHQ9),gs=screeningScore(A.GAD7),risk=Number(A.PHQ9[8]||0)>0;
  if(risk)safety='<div class="flag"><b>URGENT CLINICAL ALERT</b><br>PHQ-9 के अंतिम प्रश्न पर सकारात्मक उत्तर दर्ज हुआ है। यह screening result है, diagnosis नहीं। Non-medico history taker को आगे पूछताछ या counselling नहीं करनी चाहिए। निर्धारित clinical/safety pathway के अनुसार अधिकृत clinician/mental-health professional को तुरंत निजी रूप से सूचित करें।</div>';
  screening='<h3>Clinician-only Anxiety & Depression Screening</h3><div class="private"><b>Privacy:</b> यह परिणाम केवल अधिकृत clinician/clinical reviewer के लिए है। Non-medico history taker को व्यक्तिगत उत्तर प्रदर्शित न करें।</div><table><tr><th>Instrument</th><th>Score</th><th>Screening range</th></tr><tr><td>PHQ-9</td><td>'+ps+'/27</td><td>'+phqSeverity(ps)+'</td></tr><tr><td>GAD-7</td><td>'+gs+'/21</td><td>'+gadSeverity(gs)+'</td></tr><tr><td>Daily-life impact</td><td colspan="2">'+esc(["बिल्कुल कोई परेशानी नहीं","थोड़ी परेशानी","काफी परेशानी","बहुत ज्यादा परेशानी"][A.screenImpact]||"Not recorded")+'</td></tr></table><p class="small"><b>Important:</b> These are screening scores, not diagnoses. Clinical assessment is required before diagnosis or treatment.</p>';
 }else if(A['16.10']==='नहीं')screening='<div class="private"><b>Private screening:</b> Patient declined. No PHQ-9/GAD-7 screening was performed and no further probing was done.</div>';
 app.innerHTML='<h2>Clinician Report — Section 16: Stress, Emotional & Psychological History</h2>'+safety+screening+'<p><b>Screening consent:</b> '+esc(A['16.10']||'Not recorded')+'<br><b>Social support:</b> '+esc(A['16.7']||'Not recorded')+'<br><b>Loneliness:</b> '+esc(A['16.8']||'Not recorded')+'<br><b>Caregiver stress:</b> '+esc(A['16.9']||'Not recorded')+'</p>'+summary()+'<button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn" onclick="location.reload()">Start Again</button>'
}
render();</script></div></body></html>
